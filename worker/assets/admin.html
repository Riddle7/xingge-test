<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>Generative Jurisprudence · Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;

      /* 纯白底色，彻底告别灰蒙蒙 */
      --bg-base: #FFFFFF;
      --bg-elevated: #FFFFFF;
      --bg-card: #FFFFFF;
      --bg-card-hover: #F8FAFC;
      --bg-input: #FFFFFF;

      /* 边框：清晰但不沉重 */
      --border: rgba(15, 23, 42, 0.10);
      --border-subtle: rgba(15, 23, 42, 0.06);
      --border-focus: #0369A1;

      /* 文字：冷调中性灰（slate），不使用莫兰迪色系 */
      --text-primary: #0F172A;
      --text-secondary: #475569;
      --text-tertiary: #94A3B8;
      --text-muted: #CBD5E1;

      /* 强调：明亮学术蓝 + 沙金，替代深炭 */
      --accent: #0369A1;
      --accent-hover: #075985;
      --accent-pressed: #0C4A6E;
      --accent-glow: rgba(3, 105, 161, 0.12);
      --gold: #C9A227;
      --gold-soft: rgba(201, 162, 39, 0.10);

      /* 语义色 */
      --success: #059669;
      --warning: #B45309;
      --danger: #DC2626;
      --info: #0369A1;

      /* 数据可视化颜色：莫兰迪色系（提亮版），保持低饱和高级灰调 */
      --data-0: #7E8FA3;
      --data-1: #C7B292;
      --data-2: #9CAD8E;
      --data-3: #C99489;
      --data-4: #8E9EAE;
      --data-5: #D6C5AC;
      --data-6: #AD9D8C;
      --data-7: #8EAC9F;
      --data-8: #B8958F;
      --data-9: #7E9CAC;
      --data-10: #B8A895;
      --data-11: #9D8CA7;
      --data-12: #8EA898;
      --data-13: #C8A995;
      --data-14: #AD8C93;
      --data-15: #7E9C8F;
      --data-16: #BAAB94;

      /* 形状系统 */
      --radius: 20px;
      --radius-sm: 12px;
      --radius-lg: 24px;
      --radius-pill: 999px;

      /* 阴影：更淡、更通透 */
      --shadow-sm: 0 1px 2px rgba(28, 25, 23, 0.03);
      --shadow-card: 0 2px 12px rgba(28, 25, 23, 0.04);
      --shadow-float: 0 8px 28px rgba(28, 25, 23, 0.07);
      --shadow-glow: 0 0 24px var(--accent-glow);

      --header-h: 72px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* 强制尊重 hidden 属性，防止 display:flex/grid 等覆盖导致隐藏失效 */
    [hidden] { display: none !important; }

    html, body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-base);
      color: var(--text-primary);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -webkit-tap-highlight-color: transparent;
    }

    /* 触摸设备：禁用 hover 时的位移效果，避免误触跳动 */
    @media (hover: none) {
      .btn:hover, .kpi-card:hover, .card:hover, .nav-tab:hover {
        transform: none !important;
      }
    }

    /* body 直接使用纯色底，不加渐变叠加层，避免灰蒙蒙 */

    .container {
      position: relative;
      z-index: 1;
      max-width: 1440px;
      margin: 0 auto;
      padding: 32px;
    }

    /* Header */
    .header {
      position: sticky;
      top: 0;
      z-index: 50;
      height: var(--header-h);
      background: #FFFFFF;
      border-bottom: 1px solid var(--border);
    }
    .header-inner {
      max-width: 1440px;
      height: 100%;
      margin: 0 auto;
      padding: 0 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .brand-mark {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: var(--accent);
      display: grid;
      place-items: center;
      color: #fff;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 14px;
    }
    .brand h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-primary);
    }
    .brand .subtitle {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-tertiary);
      font-family: 'JetBrains Mono', monospace;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      padding: 4px 8px;
      background: var(--border-subtle);
      border-radius: 6px;
    }

    .nav-tabs {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px;
      background: #F1F5F9;
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
    }
    .nav-tab {
      padding: 8px 18px;
      border-radius: var(--radius-pill);
      background: transparent;
      border: none;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      cursor: pointer;
      transition: color 0.2s, background 0.2s, transform 0.1s;
      white-space: nowrap;
      position: relative;
    }
    .nav-tab:hover { color: var(--text-primary); }
    .nav-tab:active { transform: scale(0.97); }
    .nav-tab.active {
      background: var(--bg-elevated);
      color: var(--text-primary);
      box-shadow: 0 1px 4px rgba(28, 25, 23, 0.08);
    }
    .nav-tab.active::after {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border);
      pointer-events: none;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
    }
    .meta-info {
      font-size: 11px;
      color: var(--text-tertiary);
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.01em;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: var(--shadow-sm);
    }
    .btn:hover {
      background: var(--bg-card-hover);
      color: var(--text-primary);
      border-color: rgba(28, 25, 23, 0.12);
      transform: translateY(-1px);
      box-shadow: var(--shadow-card);
    }
    .btn:active { transform: translateY(0); }
    .btn-primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .btn-primary:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }
    .btn-danger {
      color: var(--danger);
      border-color: rgba(220, 38, 38, 0.15);
      background: rgba(220, 38, 38, 0.04);
      box-shadow: none;
    }
    .btn-danger:hover {
      background: rgba(220, 38, 38, 0.08);
      border-color: rgba(220, 38, 38, 0.25);
    }

    /* Login */
    .login-viewport {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow: hidden;
      background: var(--bg-base);
    }
    /* 学术方格纸网格 + 点阵装饰 */
    .login-viewport::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        /* 细方格 */
        linear-gradient(rgba(28, 25, 23, 0.022) 1px, transparent 1px),
        linear-gradient(90deg, rgba(28, 25, 23, 0.022) 1px, transparent 1px),
        /* 点阵（每 4 格一个点） */
        radial-gradient(circle, rgba(201, 162, 39, 0.22) 1px, transparent 1.5px);
      background-size: 32px 32px, 32px 32px, 128px 128px;
      background-position: 0 0, 0 0, 16px 16px;
      mask-image: radial-gradient(ellipse 70% 60% at 50% 50%, #000 30%, transparent 90%);
      -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 50%, #000 30%, transparent 90%);
      pointer-events: none;
    }
    /* 左右垂直装饰线 + 顶部底部刻度 */
    .login-viewport::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(180deg, transparent, rgba(201, 162, 39, 0.18) 20%, rgba(201, 162, 39, 0.18) 80%, transparent),
        linear-gradient(180deg, transparent, rgba(3, 105, 161, 0.14) 20%, rgba(3, 105, 161, 0.14) 80%, transparent);
      background-size: 1px 100%, 1px 100%;
      background-position: 10% 0, 90% 0;
      background-repeat: no-repeat;
      pointer-events: none;
    }
    /* 角落坐标刻度装饰 */
    .login-corners {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    .login-corner {
      position: absolute;
      width: 24px;
      height: 24px;
      border: 1px solid rgba(201, 162, 39, 0.30);
    }
    .login-corner.tl { top: 24px; left: 24px; border-right: none; border-bottom: none; }
    .login-corner.tr { top: 24px; right: 24px; border-left: none; border-bottom: none; }
    .login-corner.bl { bottom: 24px; left: 24px; border-right: none; border-top: none; }
    .login-corner.br { bottom: 24px; right: 24px; border-left: none; border-top: none; }
    .login-wrap {
      position: relative;
      width: 100%;
      max-width: 420px;
      background: #FFFFFF;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-float);
      overflow: hidden;
    }
    /* 顶部品牌色块条 */
    .login-wrap::before {
      content: '';
      height: 4px;
      background: linear-gradient(90deg, var(--accent), var(--gold));
    }
    .login-brand {
      padding: 40px 40px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .login-brand-mark {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: var(--accent);
      display: grid;
      place-items: center;
      color: #fff;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 22px;
      letter-spacing: -0.02em;
      box-shadow: 0 8px 24px rgba(3, 105, 161, 0.22);
      position: relative;
    }
    .login-brand-mark::after {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 18px;
      border: 1px solid var(--gold);
      opacity: 0.4;
    }
    .login-brand-text {
      text-align: center;
    }
    .login-brand-text h2 {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 22px;
      letter-spacing: -0.03em;
      color: var(--text-primary);
      margin-bottom: 4px;
    }
    .login-brand-text .login-subtitle {
      font-size: 11px;
      color: var(--text-tertiary);
      font-family: 'JetBrains Mono', monospace;
      text-transform: uppercase;
      letter-spacing: 0.14em;
    }
    .login-form {
      padding: 32px 40px 36px;
    }
    .login-field {
      position: relative;
      margin-bottom: 20px;
    }
    .login-field-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-tertiary);
      pointer-events: none;
      transition: color 0.2s;
    }
    .login-field input {
      width: 100%;
      padding: 14px 14px 14px 42px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--bg-input);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 14px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .login-field input::placeholder { color: var(--text-tertiary); }
    .login-field input:focus {
      outline: none;
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(3, 105, 161, 0.10);
    }
    .login-field input:focus + .login-field-icon,
    .login-field input:focus ~ .login-field-icon {
      color: var(--accent);
    }
    .login-error {
      color: var(--danger);
      font-size: 12px;
      margin-bottom: 16px;
      min-height: 18px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: 'JetBrains Mono', monospace;
    }
    .login-error:not(:empty)::before {
      content: '!';
      display: inline-grid;
      place-items: center;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--danger);
      color: #fff;
      font-size: 9px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .login-submit {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: var(--accent);
      color: #fff;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
      letter-spacing: 0.02em;
    }
    .login-submit:hover {
      background: var(--accent-hover);
      box-shadow: 0 8px 24px rgba(3, 105, 161, 0.20);
    }
    .login-submit:active { transform: scale(0.98); }
    .login-footer {
      padding: 0 40px 32px;
      text-align: center;
    }
    .login-footer-text {
      font-size: 11px;
      color: var(--text-tertiary);
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.04em;
      padding-top: 24px;
      border-top: 1px solid var(--border-subtle);
    }

    /* KPI Bento Grid */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin-bottom: 28px;
    }
    .kpi-grid .kpi-card:first-child,
    .kpi-grid .kpi-card:nth-child(2) {
      grid-column: span 1;
    }
    .kpi-card {
      position: relative;
      background: #FFFFFF;
      padding: 24px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.25s, box-shadow 0.25s;
      overflow: hidden;
    }
    .kpi-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--accent), var(--gold));
      opacity: 0;
      transition: opacity 0.25s;
    }
    .kpi-card:hover {
      transform: translateY(-3px);
      border-color: rgba(28, 25, 23, 0.12);
      box-shadow: var(--shadow-float);
    }
    .kpi-card:hover::before { opacity: 1; }
    .kpi-label {
      font-size: 11px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-bottom: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .kpi-value {
      font-size: 38px;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: -0.04em;
      color: var(--text-primary);
      line-height: 1;
    }
    .kpi-delta {
      font-size: 12px;
      margin-top: 14px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
    }
    .kpi-delta.up {
      color: var(--success);
      background: rgba(5, 150, 105, 0.08);
    }
    .kpi-delta.down {
      color: var(--danger);
      background: rgba(220, 38, 38, 0.08);
    }
    .kpi-delta.flat {
      color: var(--text-tertiary);
      background: var(--border-subtle);
    }
    .kpi-icon {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      display: grid;
      place-items: center;
      background: var(--gold-soft);
      color: var(--gold);
    }

    /* Chart Cards */
    .chart-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 28px;
    }
    .chart-grid.full { grid-template-columns: 1fr; }

    .card {
      background: #FFFFFF;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      transition: box-shadow 0.25s, border-color 0.25s;
    }
    .card:hover {
      box-shadow: var(--shadow-card);
      border-color: rgba(28, 25, 23, 0.1);
    }
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 22px 24px;
      border-bottom: 1px solid var(--border-subtle);
    }
    .card-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.01em;
    }
    .card-body { padding: 24px; }
    .chart-canvas-wrap {
      position: relative;
      height: 260px;
    }
    .chart-canvas-wrap.tall { height: 380px; }

    /* 概览页：让 24 小时分布图表填充卡片可用高度，消除与人格分布卡片的高度差导致的空白 */
    .card-chart-fill {
      display: flex;
      flex-direction: column;
    }
    .card-chart-fill .card-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .card-chart-fill .chart-canvas-wrap {
      flex: 1;
      min-height: 260px;
      height: auto;
    }

    .controls {
      display: flex;
      gap: 4px;
      padding: 3px;
      background: #F1F5F9;
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
    }
    .controls button {
      padding: 5px 14px;
      font-size: 11px;
      font-weight: 700;
      border: none;
      border-radius: var(--radius-pill);
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.15s;
      font-family: inherit;
    }
    .controls button:hover { color: var(--text-primary); }
    .controls button.active {
      background: var(--bg-elevated);
      color: var(--text-primary);
      box-shadow: 0 1px 4px rgba(28, 25, 23, 0.08);
    }

    /* Table */
    .table-body {
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      font-size: 13px;
    }
    th {
      text-align: left;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      font-weight: 700;
      color: var(--text-tertiary);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      white-space: nowrap;
      background: #F8FAFC;
    }
    td {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      transition: background 0.15s, color 0.15s;
    }
    tr:hover td {
      color: var(--text-primary);
      background: #F8FAFC;
    }
    tr:last-child td { border-bottom: none; }
    .mono {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--text-primary);
    }
    .muted { color: var(--text-tertiary); }

    .bar-cell {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .bar {
      height: 5px;
      background: var(--data-0);
      border-radius: var(--radius-pill);
      min-width: 4px;
    }
    .bar-track {
      flex: 1;
      height: 5px;
      background: var(--border-subtle);
      border-radius: var(--radius-pill);
      overflow: hidden;
    }

    /* Heatmap */
    .heatmap-wrap {
      overflow-x: auto;
      padding-bottom: 8px;
    }
    .heatmap-grid {
      display: grid;
      grid-template-columns: 50px repeat(24, 1fr);
      gap: 3px;
      font-size: 10px;
      min-width: 760px;
    }
    .heatmap-cell {
      aspect-ratio: 1;
      border-radius: 6px;
      background: var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      color: transparent;
      transition: transform 0.15s, color 0.15s, box-shadow 0.15s;
      cursor: crosshair;
    }
    .heatmap-cell:hover {
      color: var(--text-primary);
      transform: scale(1.2);
      z-index: 2;
      box-shadow: 0 4px 14px rgba(28, 25, 23, 0.14);
      border: 1px solid rgba(3, 105, 161, 0.25);
    }
    .heatmap-label {
      color: var(--text-tertiary);
      padding: 4px;
      text-align: right;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
    }

    /* Section visibility */
    section.tab-content { display: none; animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
    section.tab-content.active { display: block; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      padding: 12px 18px;
      border-radius: 14px;
      background: var(--bg-card);
      color: var(--text-primary);
      font-size: 13px;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.3s, transform 0.3s;
      z-index: 100;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-float);
      pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.error {
      border-color: rgba(220, 38, 38, 0.2);
      color: var(--danger);
      background: rgba(220, 38, 38, 0.03);
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg-base); }
    ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: var(--radius-pill); }
    ::-webkit-scrollbar-thumb:hover { background: #94A3B8; }

    /* ===== 人格分布：CSS 横条图（设计风格：动态 UI 数据可视化） ===== */
    .dist-widget {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: transparent;
      border: none;
      border-radius: 0;
      padding: 0;
      color: var(--text-primary);
    }
    .dist-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 4px;
    }
    .dist-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.01em;
    }
    .dist-total {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--text-tertiary);
      font-weight: 500;
    }
    .dist-total strong {
      color: var(--accent);
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .dist-sub {
      font-size: 11px;
      color: var(--text-tertiary);
      margin-bottom: 16px;
      font-weight: 500;
    }
    .dist-legend {
      display: flex;
      gap: 16px;
      margin-bottom: 14px;
      flex-wrap: wrap;
      font-size: 11px;
      color: var(--text-tertiary);
      font-weight: 500;
    }
    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      display: inline-block;
      flex-shrink: 0;
    }
    .legend-s { background: var(--dist-s, #6366f1); }
    .legend-o { background: var(--dist-o, #14b8a6); }
    .legend-h { background: var(--dist-hybrid, #f43f5e); }

    .dist-rows {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .dist-row {
      display: grid;
      grid-template-columns: 120px 1fr 100px;
      align-items: center;
      gap: 12px;
      padding: 4px 8px;
      margin: 0 -8px;
      border-radius: 6px;
      transition: background-color 200ms cubic-bezier(0.16, 1, 0.3, 1);
    }
    .row-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: 0.02em;
      text-align: right;
      white-space: nowrap;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 1px;
      line-height: 1.2;
    }
    .row-label-code {
      font-family: inherit;
      font-size: inherit;
      font-weight: inherit;
      color: inherit;
      letter-spacing: inherit;
    }
    .row-label-cn {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 10px;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
      transition: color 200ms cubic-bezier(0.16, 1, 0.3, 1);
    }
    .row-label.focal .row-label-code { color: var(--accent); }
    .row-label.focal .row-label-cn { color: var(--text-tertiary); }
    .row-label .hybrid-tag {
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      color: var(--text-tertiary);
      font-size: 10px;
      margin-left: 2px;
      letter-spacing: 0.02em;
    }
    .bar-track {
      height: 18px;
      background: #F1F5F9;
      border-radius: 4px;
      position: relative;
      overflow: hidden;
      transition: background-color 200ms cubic-bezier(0.16, 1, 0.3, 1);
    }
    .bar-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 280ms cubic-bezier(0.16, 1, 0.3, 1),
                  filter 200ms cubic-bezier(0.16, 1, 0.3, 1),
                  transform 200ms cubic-bezier(0.16, 1, 0.3, 1);
      background: var(--dist-s, #6366f1);
      transform-origin: center;
    }
    .bar-fill.s-group { background: var(--dist-s, #6366f1); }
    .bar-fill.o-group { background: var(--dist-o, #14b8a6); }
    .bar-fill.hybrid { background: var(--dist-hybrid, #f43f5e); }
    .bar-fill.focal {
      background: linear-gradient(90deg, var(--accent), #075985);
    }
    .row-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--text-primary);
      text-align: right;
      white-space: nowrap;
      font-weight: 500;
      transition: color 200ms cubic-bezier(0.16, 1, 0.3, 1);
    }
    .row-value .pct {
      color: var(--text-tertiary);
      margin-left: 4px;
      font-size: 11px;
      font-weight: 500;
    }
    .row-value.focal .pct { color: var(--accent); font-weight: 700; }

    /* 悬停效果：克制的基础反馈，仅在支持 hover 的设备上启用 */
    @media (hover: hover) {
      .dist-row:hover {
        background: rgba(15, 23, 42, 0.025);
      }
      .dist-row:hover .bar-track {
        background: #E8EEF4;
      }
      .dist-row:hover .bar-fill {
        filter: brightness(1.06);
        transform: scaleY(1.08);
      }
      .dist-row:hover .row-label-cn {
        color: var(--text-secondary);
      }
      .dist-row:hover .row-label.focal .row-label-cn {
        color: var(--accent-hover);
      }
      .dist-row:hover .row-value {
        color: var(--text-primary);
      }
    }
    .dist-footer {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--border-subtle);
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* 人格分布组颜色变量 —— 莫兰迪色系（提亮版） */
    .dist-widget {
      --dist-s: #7E8FA3;
      --dist-o: #8EAC9F;
      --dist-hybrid: #B8958F;
    }

    /* Responsive */
    /* 平板及以下：KPI 4 列 → 2 列 */
    @media (max-width: 1024px) {
      .kpi-grid { grid-template-columns: repeat(2, 1fr); }
      .kpi-grid .kpi-card:first-child,
      .kpi-grid .kpi-card:nth-child(2) { grid-column: span 1; }
    }

    /* 768px 以下：图表单列、卡片紧凑、padding 收缩 */
    @media (max-width: 768px) {
      .chart-grid { grid-template-columns: 1fr; }
      .container {
        padding: 20px 16px;
        padding-left: max(16px, env(safe-area-inset-left));
        padding-right: max(16px, env(safe-area-inset-right));
      }
      .card-header { padding: 18px 20px; }
      .card-body { padding: 20px; }
    }

    /* 640px 以下：移动端核心布局 - 双行 Header、横向 Nav、紧凑 KPI 2 列 */
    @media (max-width: 640px) {
      :root { --header-h: 100px; }
      .container {
        padding: 16px 14px;
        padding-left: max(14px, env(safe-area-inset-left));
        padding-right: max(14px, env(safe-area-inset-right));
      }
      .header-inner {
        padding: 8px 12px;
        padding-top: max(8px, env(safe-area-inset-top));
        padding-left: max(12px, env(safe-area-inset-left));
        padding-right: max(12px, env(safe-area-inset-right));
        flex-wrap: wrap;
        gap: 6px;
        row-gap: 4px;
      }
      /* 第一行：brand 左 + actions 右，紧凑对齐 */
      .brand {
        order: 1;
        flex: 1;
        min-width: 0;
        gap: 8px;
      }
      .brand h1 {
        font-size: 14px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .brand-mark { width: 28px; height: 28px; border-radius: 8px; font-size: 12px; flex-shrink: 0; }
      .brand .subtitle { font-size: 9px; letter-spacing: 0.08em; flex-shrink: 0; }
      .header-actions {
        order: 2;
        gap: 6px;
        flex-shrink: 0;
      }
      .meta-info { display: none; }
      .btn { padding: 8px 12px; font-size: 12px; min-height: 36px; }

      /* 第二行：Nav 横向滚动 */
      .nav-tabs {
        order: 3;
        width: 100%;
        overflow-x: auto;
        white-space: nowrap;
        flex-wrap: nowrap;
        -webkit-overflow-scrolling: touch;
        padding: 3px;
        scrollbar-width: none;
        justify-content: flex-start;
      }
      .nav-tabs::-webkit-scrollbar { display: none; }
      .nav-tab {
        flex-shrink: 0;
        padding: 9px 14px;
        font-size: 12px;
        min-height: 36px;
        display: inline-flex;
        align-items: center;
      }

      /* KPI：保持 2 列，紧凑内边距 */
      .kpi-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
        margin-bottom: 16px;
      }
      .kpi-card { padding: 16px; }
      .kpi-value { font-size: 22px; }
      .kpi-label {
        font-size: 10px;
        letter-spacing: 0.08em;
        margin-bottom: 8px;
        gap: 6px;
      }
      .kpi-delta { font-size: 10px; padding: 3px 8px; margin-top: 10px; }
      .kpi-icon { width: 18px; height: 18px; }

      /* 卡片紧凑 */
      .card-header {
        padding: 14px 16px;
        gap: 8px;
        flex-wrap: wrap;
      }
      .card-body { padding: 14px 16px; }
      .chart-canvas-wrap { height: 220px; }
      .chart-canvas-wrap.tall { height: 300px; }
      .card-chart-fill .chart-canvas-wrap { min-height: 220px; }
      .card-title { font-size: 14px; }

      /* 表格：紧凑、可横滚 */
      .table-body { overflow-x: auto; -webkit-overflow-scrolling: touch; }
      table { font-size: 12px; }
      th { padding: 10px 12px; font-size: 10px; letter-spacing: 0.08em; }
      td { padding: 11px 12px; }
      .mono { font-size: 11px; }

      /* 热力图：横滚、紧凑 */
      .heatmap-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 12px; }
      .heatmap-grid { min-width: 580px; gap: 2px; font-size: 10px; }
      .heatmap-label { padding: 2px; font-size: 10px; }

      /* 控件按钮触摸目标 */
      /* 人格分布移动端 */
      .dist-row { grid-template-columns: 108px 1fr 82px; gap: 8px; }
      .row-label { font-size: 11px; }
      .row-label-cn { font-size: 10px; }
      .row-value { font-size: 11px; }
      .bar-track { height: 16px; }
      .dist-footer { font-size: 10px; flex-wrap: wrap; gap: 4px; }

      .controls button { padding: 7px 14px; font-size: 11px; min-height: 32px; }

      /* Toast 避开底部 Home Bar */
      .toast {
        right: 14px;
        bottom: max(14px, env(safe-area-inset-bottom));
        left: 14px;
        font-size: 12px;
        padding: 12px 16px;
      }

      /* 登录页移动端 */
      .login-wrap { margin: 0; max-width: none; }
      .login-brand { padding: 32px 24px 0; }
      .login-form { padding: 24px 24px 28px; }
      .login-footer { padding: 0 24px max(24px, env(safe-area-inset-bottom)); }
      .login-brand-mark { width: 48px; height: 48px; font-size: 18px; }
      .login-brand-text h2 { font-size: 19px; }
    }

    /* 超小屏幕（≤420px）：保持 KPI 2 列、更紧凑 */
    @media (max-width: 420px) {
      .container { padding: 14px 12px; }
      .header-inner { padding: 6px 10px; gap: 4px; row-gap: 4px; }
      .brand h1 { font-size: 13px; }
      .brand .subtitle { display: none; }
      .nav-tab { padding: 8px 12px; font-size: 11px; }

      /* KPI 保持 2 列，避免单卡过宽 */
      .kpi-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
        margin-bottom: 14px;
      }
      .kpi-card { padding: 14px; }
      .kpi-value { font-size: 20px; }
      .kpi-label { font-size: 10px; margin-bottom: 8px; }
      .kpi-delta { font-size: 10px; padding: 2px 7px; margin-top: 8px; }

      .card-header { padding: 12px 14px; }
      .card-body { padding: 12px 14px; }
      .chart-canvas-wrap { height: 200px; }
      .chart-canvas-wrap.tall { height: 260px; }
      .card-chart-fill .chart-canvas-wrap { min-height: 200px; }
      .card-title { font-size: 13px; }

      table { font-size: 11px; }
      th { padding: 9px 10px; font-size: 10px; }
      td { padding: 9px 10px; }
      .mono { font-size: 10px; }

      .heatmap-grid { min-width: 520px; gap: 1px; font-size: 9px; }
      .heatmap-cell { border-radius: 3px; }

      /* 人格分布超小屏 */
      .dist-row { grid-template-columns: 96px 1fr 72px; gap: 6px; }
      .row-label { font-size: 10px; letter-spacing: 0.01em; }
      .row-label-cn { font-size: 9px; }
      .row-value { font-size: 10px; }
      .row-value .pct { font-size: 10px; }
      .bar-track { height: 14px; }

      .controls button { padding: 7px 12px; font-size: 10px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <!-- Login View -->
  <div id="login-view" class="login-viewport" hidden>
    <div class="login-corners">
      <span class="login-corner tl"></span>
      <span class="login-corner tr"></span>
      <span class="login-corner bl"></span>
      <span class="login-corner br"></span>
    </div>
    <div class="login-wrap">
      <div class="login-brand">
        <div class="login-brand-mark">GJ</div>
        <div class="login-brand-text">
          <h2>Generative Jurisprudence</h2>
          <div class="login-subtitle">Admin Console</div>
        </div>
      </div>
      <div class="login-form">
        <div class="login-field">
          <input type="password" id="password-input" placeholder="输入管理密码" autocomplete="current-password">
          <svg class="login-field-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </div>
        <div id="login-error" class="login-error"></div>
        <button id="login-btn" class="login-submit">登 录</button>
      </div>
      <div class="login-footer">
        <div class="login-footer-text">Restricted Access · Authorized Only</div>
      </div>
    </div>
  </div>

  <!-- Main Dashboard -->
  <div id="dashboard" hidden>
    <header class="header">
      <div class="header-inner">
        <div class="brand">
          <div class="brand-mark">GJ</div>
          <h1>Generative Jurisprudence</h1>
          <span class="subtitle">Admin</span>
        </div>
        <nav class="nav-tabs" id="nav-tabs">
          <button class="nav-tab active" data-tab="overview">概览</button>
          <button class="nav-tab" data-tab="visits">访问</button>
          <button class="nav-tab" data-tab="tests">测试</button>
          <button class="nav-tab" data-tab="types">人格</button>
          <button class="nav-tab" data-tab="sessions">会话</button>
          <button class="nav-tab" data-tab="heatmap">热力图</button>
        </nav>
        <div class="header-actions">
          <span class="meta-info" id="last-update">最后更新：-</span>
          <button class="btn" id="refresh-btn">立即刷新</button>
          <button class="btn btn-danger" id="logout-btn">退出</button>
        </div>
      </div>
    </header>

    <main class="container">
      <!-- Overview Tab -->
      <section id="tab-overview" class="tab-content active">
        <div class="kpi-grid" id="overview-kpis"></div>
        <div class="chart-grid full">
          <div class="card">
            <div class="card-header">
              <div class="card-title">近 30 天趋势</div>
              <div class="controls">
                <button data-trend-days="7">7 天</button>
                <button data-trend-days="30" class="active">30 天</button>
              </div>
            </div>
            <div class="card-body">
              <div class="chart-canvas-wrap"><canvas id="chart-trend"></canvas></div>
            </div>
          </div>
        </div>
        <div class="chart-grid">
          <div class="card card-chart-fill">
            <div class="card-header"><div class="card-title">24 小时分布（今日）</div></div>
            <div class="card-body">
              <div class="chart-canvas-wrap"><canvas id="chart-hourly"></canvas></div>
            </div>
          </div>
          <div class="card">
            <div class="card-header"><div class="card-title">当日人格分布</div></div>
            <div class="card-body">
              <div id="dist-overview-today" class="dist-widget"></div>
            </div>
          </div>
        </div>
        <div class="card" style="margin-top:20px">
          <div class="card-header"><div class="card-title">Top 10 页面</div></div>
          <div class="card-body table-body">
            <table><thead><tr><th>页面</th><th>访问</th><th>占比</th></tr></thead>
              <tbody id="top-pages-body"></tbody></table>
          </div>
        </div>
      </section>

      <!-- Visits Tab -->
      <section id="tab-visits" class="tab-content">
        <div class="chart-grid full">
          <div class="card">
            <div class="card-header">
              <div class="card-title">访问趋势</div>
              <div class="controls">
                <button data-visits-days="7">7 天</button>
                <button data-visits-days="30" class="active">30 天</button>
                <button data-visits-days="90">90 天</button>
              </div>
            </div>
            <div class="card-body">
              <div class="chart-canvas-wrap"><canvas id="chart-visits-trend"></canvas></div>
            </div>
          </div>
        </div>
        <div class="card" style="margin-top:20px">
          <div class="card-header"><div class="card-title">页面访问排行</div></div>
          <div class="card-body table-body">
            <table><thead><tr><th>页面</th><th>访问</th><th>占比</th></tr></thead>
              <tbody id="visits-pages-body"></tbody></table>
          </div>
        </div>
        <div class="card" style="margin-top:20px">
          <div class="card-header"><div class="card-title">来源 Referrer</div></div>
          <div class="card-body table-body">
            <table><thead><tr><th>来源</th><th>访问</th><th>占比</th></tr></thead>
              <tbody id="referrers-body"></tbody></table>
          </div>
        </div>
      </section>

      <!-- Tests Tab -->
      <section id="tab-tests" class="tab-content">
        <div class="kpi-grid" id="tests-kpis"></div>
        <div class="chart-grid full">
          <div class="card">
            <div class="card-header"><div class="card-title">测试完成趋势</div></div>
            <div class="card-body">
              <div class="chart-canvas-wrap"><canvas id="chart-tests-trend"></canvas></div>
            </div>
          </div>
        </div>
      </section>

      <!-- Types Tab -->
      <section id="tab-types" class="tab-content">
        <div class="chart-grid">
          <div class="card">
            <div class="card-header"><div class="card-title">累计分布</div></div>
            <div class="card-body">
              <div id="dist-types-cumulative" class="dist-widget"></div>
            </div>
          </div>
          <div class="card">
            <div class="card-header"><div class="card-title">今日分布</div></div>
            <div class="card-body">
              <div id="dist-types-today" class="dist-widget"></div>
            </div>
          </div>
        </div>
      </section>

      <!-- Sessions Tab -->
      <section id="tab-sessions" class="tab-content">
        <div class="kpi-grid" id="sessions-kpis"></div>
        <div class="card" style="margin-top:20px">
          <div class="card-header"><div class="card-title">最近会话</div></div>
          <div class="card-body table-body">
            <table><thead><tr><th>会话 ID</th><th>首次访问</th><th>末次访问</th><th>时长</th><th>页数</th></tr></thead>
              <tbody id="sessions-body"></tbody></table>
          </div>
        </div>
      </section>

      <!-- Heatmap Tab -->
      <section id="tab-heatmap" class="tab-content">
        <div class="card">
          <div class="card-header">
            <div class="card-title">访问热力图（7 天 × 24 小时）</div>
            <div class="controls">
              <button data-heat-days="7" class="active">7 天</button>
              <button data-heat-days="14">14 天</button>
              <button data-heat-days="30">30 天</button>
            </div>
          </div>
          <div class="card-body">
            <div class="heatmap-wrap" id="heatmap-wrap"></div>
          </div>
        </div>
      </section>
