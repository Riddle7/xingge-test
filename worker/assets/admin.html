<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Generative Jurisprudence · Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-brand-500: #007aff;
      --color-brand-700: #004fad;
      --color-foreground: #1d1d1f;
      --color-muted: #6e6e73;
      --color-muted-foreground: #8e8e93;
      --color-border: #e5e5ea;
      --color-background: #ffffff;
      --color-background-100: #f7f7fa;
      --color-card: #ffffff;
      --color-success: #34c759;
      --color-warning: #ff9500;
      --color-danger: #ff3b30;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--color-background-100);
      color: var(--color-foreground);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    .container { max-width: 1280px; margin: 0 auto; padding: 24px; }

    /* Header */
    .header {
      background: var(--color-card);
      border-bottom: 1px solid var(--color-border);
      padding: 16px 24px;
      position: sticky; top: 0; z-index: 10;
    }
    .header-inner {
      max-width: 1280px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px; flex-wrap: wrap;
    }
    .header h1 {
      font-family: 'DM Sans', sans-serif;
      font-weight: 700; font-size: 18px;
      letter-spacing: -0.01em;
    }
    .header h1 .subtitle {
      color: var(--color-muted); font-weight: 400; font-size: 13px;
      margin-left: 8px;
    }
    .nav-tabs {
      display: flex; gap: 4px; flex-wrap: wrap;
    }
    .nav-tab {
      padding: 6px 14px; border-radius: 8px;
      background: transparent; border: none;
      font-family: inherit; font-size: 13px; font-weight: 500;
      color: var(--color-muted); cursor: pointer;
      transition: all 0.15s;
    }
    .nav-tab:hover { background: var(--color-background-100); color: var(--color-foreground); }
    .nav-tab.active { background: var(--color-brand-500); color: #fff; }
    .header-actions { display: flex; align-items: center; gap: 12px; }
    .meta-info {
      font-size: 12px; color: var(--color-muted-foreground);
      font-family: 'JetBrains Mono', monospace;
    }
    .btn {
      padding: 6px 14px; border-radius: 8px;
      border: 1px solid var(--color-border);
      background: var(--color-card); color: var(--color-foreground);
      font-family: inherit; font-size: 13px; font-weight: 500;
      cursor: pointer; transition: all 0.15s;
    }
    .btn:hover { background: var(--color-background-100); }
    .btn-primary { background: var(--color-brand-500); color: #fff; border-color: var(--color-brand-500); }
    .btn-primary:hover { background: var(--color-brand-700); }
    .btn-danger { color: var(--color-danger); border-color: var(--color-danger); }
    .btn-danger:hover { background: rgba(255,59,48,0.08); }

    /* Login */
    .login-wrap {
      max-width: 360px; margin: 80px auto; padding: 32px;
      background: var(--color-card); border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.04);
    }
    .login-wrap h2 { margin-bottom: 16px; font-weight: 700; }
    .login-wrap input {
      width: 100%; padding: 10px 12px;
      border: 1px solid var(--color-border); border-radius: 8px;
      font-family: inherit; font-size: 14px; margin-bottom: 12px;
    }
    .login-wrap input:focus { outline: none; border-color: var(--color-brand-500); }
    .login-error { color: var(--color-danger); font-size: 12px; margin-bottom: 12px; min-height: 16px; }

    /* KPI Cards */
    .kpi-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px; margin-bottom: 24px;
    }
    .kpi-card {
      background: var(--color-card); padding: 20px;
      border-radius: 12px; border: 1px solid var(--color-border);
    }
    .kpi-label {
      font-size: 12px; color: var(--color-muted);
      text-transform: uppercase; letter-spacing: 0.05em;
      margin-bottom: 8px;
    }
    .kpi-value {
      font-size: 32px; font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: -0.02em;
    }
    .kpi-delta {
      font-size: 12px; margin-top: 6px;
      display: flex; align-items: center; gap: 4px;
    }
    .kpi-delta.up { color: var(--color-success); }
    .kpi-delta.down { color: var(--color-danger); }
    .kpi-delta.flat { color: var(--color-muted); }

    /* Chart Cards */
    .chart-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 16px; margin-bottom: 24px;
    }
    .chart-grid.full { grid-template-columns: 1fr; }
    @media (max-width: 768px) {
      .chart-grid { grid-template-columns: 1fr; }
    }
    .chart-card {
      background: var(--color-card); padding: 20px;
      border-radius: 12px; border: 1px solid var(--color-border);
    }
    .chart-title {
      font-size: 14px; font-weight: 600; margin-bottom: 16px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .chart-title .controls { display: flex; gap: 4px; }
    .chart-title .controls button {
      padding: 4px 10px; font-size: 11px;
      border: 1px solid var(--color-border); background: var(--color-card);
      border-radius: 6px; cursor: pointer; font-family: inherit;
    }
    .chart-title .controls button.active {
      background: var(--color-brand-500); color: #fff; border-color: var(--color-brand-500);
    }
    .chart-canvas-wrap { position: relative; height: 240px; }

    /* Table */
    .table-card {
      background: var(--color-card); padding: 20px;
      border-radius: 12px; border: 1px solid var(--color-border);
    }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th {
      text-align: left; padding: 10px 12px;
      border-bottom: 1px solid var(--color-border);
      font-weight: 600; color: var(--color-muted);
      font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em;
    }
    td { padding: 10px 12px; border-bottom: 1px solid var(--color-border); }
    tr:last-child td { border-bottom: none; }
    .bar-cell { display: flex; align-items: center; gap: 8px; }
    .bar {
      height: 6px; background: var(--color-brand-500);
      border-radius: 3px; min-width: 4px;
    }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .muted { color: var(--color-muted); }

    /* Heatmap */
    .heatmap-wrap { overflow-x: auto; }
    .heatmap-grid {
      display: grid; grid-template-columns: 40px repeat(24, 1fr);
      gap: 2px; font-size: 10px; min-width: 720px;
    }
    .heatmap-cell {
      aspect-ratio: 1; border-radius: 3px;
      background: var(--color-background-100);
      display: flex; align-items: center; justify-content: center;
      color: transparent; transition: all 0.15s;
    }
    .heatmap-cell:hover { color: var(--color-foreground); transform: scale(1.2); }
    .heatmap-label { color: var(--color-muted); padding: 4px; text-align: right; }

    /* Section visibility */
    section.tab-content { display: none; }
    section.tab-content.active { display: block; }

    .toast {
      position: fixed; bottom: 24px; right: 24px;
      padding: 12px 16px; border-radius: 8px;
      background: var(--color-foreground); color: #fff;
      font-size: 13px; opacity: 0;
      transition: opacity 0.3s; z-index: 100;
    }
    .toast.show { opacity: 1; }
    .toast.error { background: var(--color-danger); }
  </style>
</head>
<body>
  <!-- Login View -->
  <div id="login-view" class="login-wrap" hidden>
    <h2>Admin Login</h2>
    <input type="password" id="password-input" placeholder="密码" autocomplete="current-password">
    <div id="login-error" class="login-error"></div>
    <button id="login-btn" class="btn btn-primary" style="width:100%">登录</button>
  </div>

  <!-- Main Dashboard -->
  <div id="dashboard" hidden>
    <header class="header">
      <div class="header-inner">
        <h1>Generative Jurisprudence <span class="subtitle">Admin</span></h1>
        <nav class="nav-tabs" id="nav-tabs">
          <button class="nav-tab active" data-tab="overview">概览</button>
          <button class="nav-tab" data-tab="visits">访问</button>
          <button class="nav-tab" data-tab="tests">测试</button>
          <button class="nav-tab" data-tab="types">人格</button>
          <button class="nav-tab" data-tab="sessions">会话</button>
          <button class="nav-tab" data-tab="heatmap">热力图</button>
        </nav>
        <div class="header-actions">
          <span class="meta-info" id="last-update">最后更新：—</span>
          <button class="btn" id="refresh-btn">立即刷新</button>
          <button class="btn btn-danger" id="logout-btn">退出</button>
        </div>
      </div>
    </header>

    <main class="container">
      <!-- Overview Tab -->
      <section id="tab-overview" class="tab-content active">
        <div class="kpi-grid" id="overview-kpis"></div>
        <div class="chart-grid full">
          <div class="chart-card">
            <div class="chart-title">近 30 天趋势
              <div class="controls">
                <button data-trend-days="7">7 天</button>
                <button data-trend-days="30" class="active">30 天</button>
              </div>
            </div>
            <div class="chart-canvas-wrap"><canvas id="chart-trend"></canvas></div>
          </div>
        </div>
        <div class="chart-grid">
          <div class="chart-card">
            <div class="chart-title">24 小时分布（今日）</div>
            <div class="chart-canvas-wrap"><canvas id="chart-hourly"></canvas></div>
          </div>
          <div class="chart-card">
            <div class="chart-title">当日人格分布</div>
            <div class="chart-canvas-wrap"><canvas id="chart-types-today"></canvas></div>
          </div>
        </div>
        <div class="table-card" style="margin-top:16px">
          <div class="chart-title">Top 10 页面</div>
          <table><thead><tr><th>页面</th><th>访问</th><th>占比</th></tr></thead>
            <tbody id="top-pages-body"></tbody></table>
        </div>
      </section>

      <!-- Visits Tab -->
      <section id="tab-visits" class="tab-content">
        <div class="chart-grid full">
          <div class="chart-card">
            <div class="chart-title">访问趋势
              <div class="controls">
                <button data-visits-days="7">7 天</button>
                <button data-visits-days="30" class="active">30 天</button>
                <button data-visits-days="90">90 天</button>
              </div>
            </div>
            <div class="chart-canvas-wrap"><canvas id="chart-visits-trend"></canvas></div>
          </div>
        </div>
        <div class="table-card" style="margin-top:16px">
          <div class="chart-title">页面访问排行</div>
          <table><thead><tr><th>页面</th><th>访问</th><th>占比</th></tr></thead>
            <tbody id="visits-pages-body"></tbody></table>
        </div>
        <div class="table-card" style="margin-top:16px">
          <div class="chart-title">来源 Referrer</div>
          <table><thead><tr><th>来源</th><th>访问</th><th>占比</th></tr></thead>
            <tbody id="referrers-body"></tbody></table>
        </div>
      </section>

      <!-- Tests Tab -->
      <section id="tab-tests" class="tab-content">
        <div class="kpi-grid" id="tests-kpis"></div>
        <div class="chart-grid full">
          <div class="chart-card">
            <div class="chart-title">测试完成趋势</div>
            <div class="chart-canvas-wrap"><canvas id="chart-tests-trend"></canvas></div>
          </div>
        </div>
      </section>

      <!-- Types Tab -->
      <section id="tab-types" class="tab-content">
        <div class="chart-grid">
          <div class="chart-card">
            <div class="chart-title">累计分布</div>
            <div class="chart-canvas-wrap" style="height:420px"><canvas id="chart-types-cumulative"></canvas></div>
          </div>
          <div class="chart-card">
            <div class="chart-title">今日分布</div>
            <div class="chart-canvas-wrap" style="height:420px"><canvas id="chart-types-today-bar"></canvas></div>
          </div>
        </div>
      </section>

      <!-- Sessions Tab -->
      <section id="tab-sessions" class="tab-content">
        <div class="kpi-grid" id="sessions-kpis"></div>
        <div class="table-card" style="margin-top:16px">
          <div class="chart-title">最近会话</div>
          <table><thead><tr><th>会话 ID</th><th>首次访问</th><th>末次访问</th><th>时长</th><th>页数</th></tr></thead>
            <tbody id="sessions-body"></tbody></table>
        </div>
      </section>

      <!-- Heatmap Tab -->
      <section id="tab-heatmap" class="tab-content">
        <div class="chart-card">
          <div class="chart-title">访问热力图（7 天 × 24 小时）
            <div class="controls">
              <button data-heat-days="7" class="active">7 天</button>
              <button data-heat-days="14">14 天</button>
              <button data-heat-days="30">30 天</button>
            </div>
          </div>
          <div class="heatmap-wrap" id="heatmap-wrap"></div>
        </div>
      </section>
    </main>
  </div>

  <div id="toast" class="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="admin.js" defer></script>
</body>
</html>
