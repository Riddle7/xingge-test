<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>法学院：期末周</title>
<style>
:root {
  --bg: #0f172a;
  --card-bg: rgba(30, 41, 59, 0.9);
  --text: #f1f5f9;
  --text-dim: #94a3b8;
  --accent: #f59e0b;
  --border: rgba(148, 163, 184, 0.2);
  --c-gpa: #f59e0b;
  --c-eng: #10b981;
  --c-san: #8b5cf6;
  --c-soc: #f43f5e;
  --c-bar: #3b82f6;
  --rarity-common: #e5e7eb;
  --rarity-rare: #3b82f6;
  --rarity-epic: #8b5cf6;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  background: var(--bg);
  background-image:
    radial-gradient(ellipse 80% 50% at 50% -10%, rgba(59, 130, 246, 0.12), transparent),
    radial-gradient(ellipse 60% 40% at 80% 110%, rgba(139, 92, 246, 0.10), transparent);
  color: var(--text);
  font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
  display: flex; justify-content: center;
  min-height: 100vh;
  overflow-x: hidden;
}
#app {
  position: relative;
  width: 100%; max-width: 480px;
  min-height: 100vh;
  padding: 16px 16px 32px;
  display: flex; flex-direction: column;
}
.mono { font-family: "SF Mono", "Consolas", monospace; }

/* ============ 深夜星空背景（纯 CSS 绘制） ============ */
.sky { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
.stars { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: #e2e8f0; }
.stars.s1 {
  box-shadow: 8vw 12vh #fff, 22vw 6vh #cbd5e1, 35vw 18vh #fff, 48vw 9vh #94a3b8,
    62vw 15vh #fff, 75vw 7vh #cbd5e1, 88vw 20vh #fff, 15vw 30vh #94a3b8,
    42vw 28vh #cbd5e1, 68vw 32vh #94a3b8, 92vw 38vh #cbd5e1, 28vw 42vh #fff,
    55vw 45vh #94a3b8, 80vw 50vh #fff, 10vw 55vh #cbd5e1, 38vw 60vh #94a3b8,
    64vw 62vh #cbd5e1, 85vw 68vh #94a3b8, 20vw 72vh #fff, 50vw 76vh #cbd5e1;
  animation: twinkle 4s ease-in-out infinite;
}
.stars.s2 {
  width: 1.5px; height: 1.5px; opacity: 0.7;
  box-shadow: 14vw 22vh #94a3b8, 30vw 10vh #64748b, 45vw 24vh #94a3b8,
    58vw 5vh #64748b, 71vw 26vh #94a3b8, 83vw 12vh #64748b, 6vw 40vh #64748b,
    25vw 52vh #64748b, 47vw 55vh #94a3b8, 72vw 58vh #64748b, 90vw 60vh #94a3b8,
    12vw 80vh #64748b, 33vw 85vh #94a3b8, 60vw 82vh #64748b, 78vw 88vh #94a3b8;
  animation: twinkle 5.5s ease-in-out 1.2s infinite;
}
@keyframes twinkle { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
.moon {
  position: absolute; top: 7vh; right: 12%;
  width: 54px; height: 54px; border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #fef3c7, #fcd34d 60%, #d97706);
  box-shadow: 0 0 40px 8px rgba(252, 211, 77, 0.25);
  animation: moonGlow 6s ease-in-out infinite;
}
@keyframes moonGlow {
  0%, 100% { box-shadow: 0 0 40px 8px rgba(252, 211, 77, 0.25); }
  50% { box-shadow: 0 0 60px 14px rgba(252, 211, 77, 0.4); }
}
.shooting-star {
  position: absolute; top: 14vh; left: -10%;
  width: 90px; height: 2px; border-radius: 2px;
  background: linear-gradient(90deg, transparent, #e2e8f0);
  animation: shoot 9s linear 3s infinite;
  opacity: 0;
}
@keyframes shoot {
  0% { transform: translateX(0) translateY(0) rotate(12deg); opacity: 0; }
  3% { opacity: 1; }
  10% { transform: translateX(130vw) translateY(18vh) rotate(12deg); opacity: 0; }
  100% { transform: translateX(130vw) translateY(18vh) rotate(12deg); opacity: 0; }
}

/* ============ SVG 图标系统（代码绘制，零图片） ============ */
.ico { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* 事件卡场景徽章 */
.scene-badge {
  width: 72px; height: 72px; margin: 0 auto 14px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: var(--accent);
  background:
    radial-gradient(circle at 50% 30%, rgba(245, 158, 11, 0.22), rgba(245, 158, 11, 0.05) 70%),
    rgba(15, 23, 42, 0.6);
  border: 1px solid rgba(245, 158, 11, 0.35);
  box-shadow: 0 0 24px rgba(245, 158, 11, 0.15), inset 0 0 18px rgba(245, 158, 11, 0.08);
  animation: badgeFloat 3.5s ease-in-out infinite;
}
.scene-badge .ico { width: 38px; height: 38px; }
.scene-badge.chain-scene { color: #f87171; border-color: rgba(248, 113, 113, 0.4); box-shadow: 0 0 24px rgba(248, 113, 113, 0.15); }
.scene-badge.exam-scene { color: #60a5fa; border-color: rgba(96, 165, 250, 0.45); box-shadow: 0 0 24px rgba(96, 165, 250, 0.2); }
@keyframes badgeFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

/* 标题页徽章与漂浮装饰 */
.title-emblem {
  width: 110px; height: 110px; margin: 0 auto;
  border-radius: 50%; color: var(--accent);
  display: flex; align-items: center; justify-content: center;
  background: radial-gradient(circle at 50% 30%, rgba(245, 158, 11, 0.25), rgba(245, 158, 11, 0.04) 72%);
  border: 1.5px solid rgba(245, 158, 11, 0.45);
  box-shadow: 0 0 44px rgba(245, 158, 11, 0.25), inset 0 0 24px rgba(245, 158, 11, 0.1);
  animation: badgeFloat 4s ease-in-out infinite;
}
.title-emblem .ico { width: 56px; height: 56px; }
.float-deco {
  position: absolute; color: rgba(148, 163, 184, 0.28);
  animation: decoFloat 7s ease-in-out infinite;
  pointer-events: none;
}
.float-deco .ico { width: 100%; height: 100%; }
@keyframes decoFloat {
  0%, 100% { transform: translateY(0) rotate(-6deg); }
  50% { transform: translateY(-16px) rotate(6deg); }
}

/* 结局场景徽章 */
.ending-scene {
  width: 96px; height: 96px; margin: 0 auto 14px;
  border-radius: 50%; color: #fbbf24;
  display: flex; align-items: center; justify-content: center;
  background: radial-gradient(circle at 50% 30%, rgba(251, 191, 36, 0.22), rgba(251, 191, 36, 0.04) 70%);
  border: 1.5px solid rgba(251, 191, 36, 0.45);
  box-shadow: 0 0 36px rgba(251, 191, 36, 0.3);
  animation: badgeFloat 4s ease-in-out infinite;
}
.ending-scene .ico { width: 48px; height: 48px; }
.ending-scene.bad {
  color: #f87171;
  background: radial-gradient(circle at 50% 30%, rgba(248, 113, 113, 0.2), rgba(248, 113, 113, 0.04) 70%);
  border-color: rgba(248, 113, 113, 0.45);
  box-shadow: 0 0 36px rgba(248, 113, 113, 0.3);
}

/* 昏睡过渡页 Zzz 动画 */
.zzz-wrap { display: flex; justify-content: center; gap: 4px; margin-bottom: 14px; height: 34px; }
.zzz-wrap .z {
  font-family: "SF Mono", "Consolas", monospace; font-weight: 700; color: #93c5fd;
  animation: zFloat 2.4s ease-in-out infinite; opacity: 0;
}
.zzz-wrap .z:nth-child(1) { font-size: 18px; animation-delay: 0s; }
.zzz-wrap .z:nth-child(2) { font-size: 24px; animation-delay: 0.35s; }
.zzz-wrap .z:nth-child(3) { font-size: 30px; animation-delay: 0.7s; }
@keyframes zFloat {
  0% { opacity: 0; transform: translateY(10px); }
  30% { opacity: 1; }
  100% { opacity: 0; transform: translateY(-14px); }
}

/* 史诗卡镭射扫光 */
.big-card.epic { position: relative; overflow: hidden; }
.big-card.epic::after {
  content: ''; position: absolute; inset: -40%;
  background: conic-gradient(from 0deg, transparent 70%, rgba(196, 181, 253, 0.35) 82%, transparent 94%);
  animation: holoSpin 3.2s linear infinite;
  pointer-events: none;
}
@keyframes holoSpin { to { transform: rotate(360deg); } }

/* 头部小月亮 */
.header-moon { width: 16px; height: 16px; vertical-align: -3px; margin-right: 4px; color: #fcd34d; }

/* ============ 标题页 ============ */
.screen-title {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center; gap: 14px;
  animation: fadeIn 500ms ease-out;
  position: relative;
}
.game-logo { font-size: 64px; filter: drop-shadow(0 4px 16px rgba(245, 158, 11, 0.35)); }
.game-title { font-size: 34px; font-weight: 800; letter-spacing: 2px; }
.game-subtitle { color: var(--text-dim); font-size: 14px; line-height: 1.8; }
.game-subtitle em { color: var(--accent); font-style: normal; }
.btn {
  display: block; width: 100%;
  padding: 14px 20px; margin-top: 10px;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 14px;
  color: var(--text); font-size: 16px; font-weight: 600;
  cursor: pointer;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  transition: transform 150ms ease, border-color 200ms ease, background 200ms ease;
  font-family: inherit;
}
.btn:hover { border-color: var(--accent); }
.btn:active { transform: scale(0.95); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-primary {
  background: linear-gradient(135deg, #f59e0b, #d97706);
  border: none; color: #1c1207;
  box-shadow: 0 4px 20px rgba(245, 158, 11, 0.3);
}
.btn-primary:hover { filter: brightness(1.1); }
.btn-ghost { background: transparent; font-weight: 400; color: var(--text-dim); }
/* 主题海报 */
.title-poster {
  width: 100%; max-width: 360px;
  border-radius: 16px; overflow: hidden;
  border: 1px solid rgba(245, 158, 11, 0.35);
  box-shadow: 0 0 36px rgba(245, 158, 11, 0.18), 0 8px 32px rgba(0, 0, 0, 0.4);
  margin-bottom: 4px;
  animation: slideUp 600ms ease-out;
  position: relative;
  background: #0d1420;
}
.title-poster img { display: block; width: 100%; height: auto; }
.title-poster::after {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  border-radius: 16px;
  box-shadow: inset 0 0 60px rgba(15, 23, 42, 0.4);
}
.title-buttons { width: 100%; max-width: 300px; margin-top: 18px; }

/* ============ 主界面：头部 ============ */
.game-header { text-align: center; padding: 6px 0 12px; }
.game-header h1 { font-size: 18px; font-weight: 700; letter-spacing: 1px; }
.day-indicator {
  margin-top: 4px; font-size: 13px; color: var(--text-dim);
  font-family: "SF Mono", "Consolas", monospace;
}
.day-indicator b { color: var(--accent); font-size: 16px; }
.day-pips { display: flex; gap: 5px; justify-content: center; margin-top: 8px; }
.day-pip {
  width: 22px; height: 4px; border-radius: 2px;
  background: rgba(148, 163, 184, 0.25);
  transition: background 300ms ease;
}
.day-pip.done { background: var(--accent); }
.day-pip.now { background: var(--text); box-shadow: 0 0 6px rgba(241, 245, 249, 0.6); }

/* ============ 资源条 ============ */
.resources {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 12px 14px;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  display: flex; flex-direction: column; gap: 8px;
}
.res-row { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.res-icon { width: 20px; text-align: center; }
.res-name { width: 44px; color: var(--text-dim); flex-shrink: 0; }
.res-track {
  flex: 1; height: 10px;
  background: rgba(148, 163, 184, 0.15);
  border-radius: 5px; overflow: hidden;
}
.res-fill {
  height: 100%; border-radius: 5px;
  transition: width 600ms cubic-bezier(0.4, 0, 0.2, 1);
}
.res-fill.gpa { background: var(--c-gpa); } .res-fill.eng { background: var(--c-eng); }
.res-fill.san { background: var(--c-san); } .res-fill.soc { background: var(--c-soc); }
.res-fill.bar { background: var(--c-bar); }
.res-num {
  width: 34px; text-align: right;
  font-family: "SF Mono", "Consolas", monospace;
  font-size: 13px; font-weight: 600;
  transition: transform 200ms ease;
}
.res-num.bump { transform: scale(1.25); color: var(--accent); }
@keyframes warnFlash {
  0%, 100% { filter: brightness(1); }
  50% { filter: brightness(2.2) saturate(1.6); }
}
.res-row.warn .res-fill { animation: warnFlash 180ms ease-in-out 3; }
.res-row.warn .res-num { color: #ef4444; }

/* ============ 事件卡 ============ */
.event-area { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 16px 0; }
.event-card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 22px 20px;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
  animation: slideUp 400ms ease-out;
  text-align: center;
}
.event-card .event-desc { text-align: left; }
@keyframes slideUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.event-tag {
  display: inline-block; font-size: 11px; color: var(--accent);
  border: 1px solid rgba(245, 158, 11, 0.4);
  border-radius: 999px; padding: 2px 10px; margin-bottom: 10px;
  letter-spacing: 1px;
}
.event-title { font-size: 20px; font-weight: 700; margin-bottom: 12px; }
.event-desc { font-size: 14.5px; line-height: 1.9; color: #cbd5e1; }
.event-note {
  margin-top: 12px; font-size: 13px; color: var(--accent);
  animation: fadeIn 400ms ease;
}

/* ============ 选项按钮 ============ */
.choices { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
.choice-btn {
  padding: 15px 18px;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 14px;
  color: var(--text); font-size: 15px; font-weight: 600;
  text-align: left; cursor: pointer;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  transition: transform 150ms ease, border-color 200ms ease, background 200ms ease;
  font-family: inherit;
  animation: slideUp 400ms ease-out backwards;
}
.choice-btn:nth-child(2) { animation-delay: 80ms; }
.choice-btn:hover:not(:disabled) { border-color: var(--accent); background: rgba(51, 65, 85, 0.9); }
.choice-btn:active:not(:disabled) { transform: scale(0.95); }
.choice-btn:disabled { opacity: 0.45; cursor: not-allowed; }
.choice-key {
  display: inline-block; width: 22px; height: 22px; line-height: 22px;
  text-align: center; border-radius: 6px; margin-right: 8px;
  background: rgba(245, 158, 11, 0.18); color: var(--accent);
  font-size: 12px; font-family: "SF Mono", "Consolas", monospace;
}

/* ============ 浮动数值提示（逐条展示） ============ */
.delta-toast {
  position: fixed; top: 18%; left: 50%; transform: translateX(-50%);
  z-index: 60; pointer-events: none;
  display: flex; flex-direction: column; gap: 6px; align-items: center;
  transition: opacity 380ms ease;
}
.delta-toast.fade-out { opacity: 0; }
.delta-item {
  background: rgba(15, 23, 42, 0.92);
  border: 1px solid var(--border);
  border-radius: 999px; padding: 5px 14px;
  font-size: 13px; font-family: "SF Mono", "Consolas", monospace;
  white-space: nowrap;
  opacity: 0; transform: translateY(8px);
  transition: opacity 320ms ease-out, transform 320ms ease-out;
}
.delta-item.show { opacity: 1; transform: translateY(0); }
.delta-item .up { color: #34d399; } .delta-item .down { color: #f87171; }

/* ============ 退出按钮（左上角，返回开始页） ============ */
.gj-link {
  position: absolute; top: 16px; left: 16px; z-index: 50;
  display: inline-flex; align-items: center; gap: 6px;
  text-decoration: none;
  color: var(--text-dim);
  transition: color 0.2s;
}
.gj-link:hover { color: var(--accent); }
.gj-link__badge {
  display: inline-flex; align-items: center; justify-content: center;
  width: 24px; height: 24px; border-radius: 5px;
  background: rgba(148, 163, 184, 0.15);
  color: var(--text);
  font-weight: 700; font-size: 10px; letter-spacing: 0.02em;
  font-family: ui-monospace, 'SF Mono', Consolas, monospace;
  transition: background 0.2s, color 0.2s;
}
.gj-link:hover .gj-link__badge { background: var(--accent); color: #0f172a; }
.gj-link__text { font-size: 11px; font-weight: 500; letter-spacing: 0.02em; }

.exit-btn {
  position: absolute; top: 16px; left: 16px;
  z-index: 100;
  display: inline-flex; align-items: center; gap: 4px;
  padding: 6px 12px 6px 8px;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 999px;
  color: var(--text-dim);
  font-size: 12px; font-family: inherit;
  cursor: pointer;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  transition: color 200ms ease, border-color 200ms ease, background 200ms ease, transform 150ms ease;
}
.exit-btn .ico { width: 14px; height: 14px; stroke-width: 2; }
.exit-btn:hover { color: var(--text); border-color: var(--accent); background: rgba(51, 65, 85, 0.9); }
.exit-btn:active { transform: scale(0.95); }

/* ============ 自定义确认对话框（替代原生 confirm） ============
   原因：IDE 内置 webview 处理同步 confirm() 时可能触发 React 渲染循环（error #185）。
   沿用现有 overlay 视觉语言：rgba(2,6,23,0.85) + blur + 18px 圆角 + var(--card-bg) */
.confirm-overlay {
  position: fixed; inset: 0; z-index: 99;
  background: rgba(2, 6, 23, 0.85);
  display: flex; align-items: center; justify-content: center;
  padding: 20px; animation: fadeIn 200ms ease;
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
.confirm-panel {
  width: 100%; max-width: 300px;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 18px; padding: 22px 20px;
  text-align: center;
  animation: cardPop 280ms cubic-bezier(0.34, 1.4, 0.64, 1) forwards;
}
.confirm-msg { font-size: 14px; line-height: 1.6; color: var(--text); margin-bottom: 18px; }
.confirm-actions { display: flex; gap: 10px; }
.confirm-actions button {
  flex: 1; padding: 10px 12px; border-radius: 10px;
  font-size: 13px; font-weight: 600; cursor: pointer;
  transition: background 150ms ease, transform 100ms ease;
}
.confirm-actions button:active { transform: scale(0.96); }
.confirm-cancel {
  background: rgba(100, 116, 139, 0.2); color: var(--text-dim);
  border: 1px solid var(--border);
}
.confirm-cancel:hover { background: rgba(100, 116, 139, 0.35); color: var(--text); }
.confirm-ok {
  background: rgba(220, 38, 38, 0.85); color: #fff;
  border: 1px solid rgba(220, 38, 38, 0.9);
}
.confirm-ok:hover { background: rgba(220, 38, 38, 1); }

/* ============ 知识卡手牌 ============ */
.hand-area { margin-top: 6px; }
.hand-label { font-size: 12px; color: var(--text-dim); margin-bottom: 6px; letter-spacing: 1px; }
.hand {
    display: flex; gap: 8px; min-height: 58px;
    overflow-x: auto; flex-wrap: nowrap;
    -webkit-overflow-scrolling: touch;
    scroll-behavior: smooth;
    padding-bottom: 2px;
  }
  /* hide scrollbar but keep scrollable */
  .hand::-webkit-scrollbar { height: 0; display: none; }
  .hand { scrollbar-width: none; -ms-overflow-style: none; }
.hand-empty {
  width: 100%; border: 1px dashed var(--border); border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  color: rgba(148, 163, 184, 0.5); font-size: 12px; padding: 14px 0;
}
.mini-card {
  width: 56px; height: 58px; flex-shrink: 0;
  border-radius: 10px;
  background: var(--card-bg);
  border: 1.5px solid var(--rarity-common);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px; cursor: default; position: relative;
  animation: slideUp 300ms ease-out;
}
.mini-card .c-icon { font-size: 20px; }
.mini-card .c-name {
  font-size: 9px; color: var(--text-dim);
  max-width: 52px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.mini-card.rare { border-color: var(--rarity-rare); box-shadow: 0 0 8px rgba(59, 130, 246, 0.35); }
.mini-card.epic {
  border-color: var(--rarity-epic);
  animation: slideUp 300ms ease-out, epicPulse 2s ease-in-out 300ms infinite;
}
@keyframes epicPulse {
  0%, 100% { box-shadow: 0 0 6px rgba(139, 92, 246, 0.4); }
  50% { box-shadow: 0 0 16px rgba(139, 92, 246, 0.8); }
}

/* 卡牌说明小框（悬停/点击显示） */
.mini-card { cursor: pointer; }
.card-tip {
  position: fixed; z-index: 70; pointer-events: none;
  width: 200px; padding: 12px 14px;
  background: rgba(15, 23, 42, 0.96);
  border: 1px solid var(--border);
  border-radius: 12px;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  box-shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
  opacity: 0; transform: translateY(6px);
  transition: opacity 180ms ease, transform 180ms ease;
  font-size: 12px; line-height: 1.6;
}
.card-tip.show { opacity: 1; transform: translateY(0); }
.card-tip .ct-head {
  display: flex; align-items: center; gap: 6px;
  margin-bottom: 6px; padding-bottom: 6px;
  border-bottom: 1px solid var(--border);
}
.card-tip .ct-icon { font-size: 18px; }
.card-tip .ct-name { font-size: 14px; font-weight: 700; color: var(--text); }
.card-tip .ct-rarity {
  margin-left: auto; font-size: 10px; letter-spacing: 1px;
  padding: 1px 6px; border-radius: 4px;
}
.card-tip .ct-rarity.普通 { background: rgba(229, 231, 235, 0.15); color: #e5e7eb; }
.card-tip .ct-rarity.稀有 { background: rgba(59, 130, 246, 0.18); color: #93c5fd; }
.card-tip .ct-rarity.史诗 { background: rgba(139, 92, 246, 0.2); color: #c4b5fd; }
.card-tip .ct-desc { color: #cbd5e1; }

/* ============ 抽卡弹窗 ============ */
.card-overlay {
  position: fixed; inset: 0; z-index: 80;
  background: rgba(2, 6, 23, 0.75);
  display: flex; align-items: center; justify-content: center;
  backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  animation: fadeIn 250ms ease;
}
.big-card {
  width: 220px; padding: 26px 20px;
  background: linear-gradient(160deg, #1e293b, #0f172a);
  border: 2px solid var(--rarity-common);
  border-radius: 18px; text-align: center;
  animation: cardPop 500ms cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
}
.big-card.rare { border-color: var(--rarity-rare); box-shadow: 0 0 30px rgba(59, 130, 246, 0.4); }
.big-card.epic { border-color: var(--rarity-epic); box-shadow: 0 0 34px rgba(139, 92, 246, 0.5); }
@keyframes cardPop {
  0% { transform: scale(0); opacity: 0; }
  70% { transform: scale(1.1); opacity: 1; }
  100% { transform: scale(1); opacity: 1; }
}
.big-card .bc-rarity { font-size: 11px; letter-spacing: 3px; color: var(--text-dim); }
.big-card .bc-icon { font-size: 52px; margin: 12px 0 8px; }
.big-card .bc-name { font-size: 18px; font-weight: 700; margin-bottom: 10px; }
.big-card .bc-desc { font-size: 13px; line-height: 1.7; color: #cbd5e1; }
.big-card .bc-hint { margin-top: 14px; font-size: 11px; color: var(--text-dim); }

/* ============ 结局页 ============ */
.ending-screen {
  position: fixed; inset: 0; z-index: 90;
  background: rgba(2, 6, 23, 0.96);
  display: flex; align-items: center; justify-content: center;
  padding: 24px; animation: fadeIn 600ms ease;
  overflow-y: auto;
}
.ending-inner { max-width: 420px; width: 100%; text-align: center; }
.ending-label { font-size: 12px; letter-spacing: 6px; color: var(--text-dim); margin-bottom: 14px; }
/* 结局场景插画 */
.ending-art {
  width: 100%; border-radius: 14px; overflow: hidden;
  border: 1px solid rgba(251, 191, 36, 0.35);
  box-shadow: 0 0 30px rgba(251, 191, 36, 0.18);
  margin-bottom: 16px;
  animation: slideUp 600ms ease-out;
  background: #0d1420;
}
.ending-art.bad {
  border-color: rgba(248, 113, 113, 0.35);
  box-shadow: 0 0 30px rgba(248, 113, 113, 0.18);
}
.ending-art svg { display: block; width: 100%; height: auto; }
.ending-art img { display: block; width: 100%; height: auto; }

/* ============ 事件场景插画（复古像素艺术 / 电影画面） ============ */
.event-art-wrap {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  border-radius: 14px;
  overflow: hidden;
  margin: 0 auto 16px;
  border: 1px solid rgba(245, 158, 11, 0.35);
  box-shadow: 0 0 26px rgba(245, 158, 11, 0.16), 0 6px 18px rgba(0, 0, 0, 0.4);
  background:
    radial-gradient(circle at 50% 35%, rgba(245, 158, 11, 0.18), rgba(15, 23, 42, 0.6) 70%),
    #0d1420;
  animation: slideUp 480ms ease-out;
}
.event-art-wrap::before {  /* 暗角 */
  content: ''; position: absolute; inset: 0; z-index: 1; pointer-events: none;
  border-radius: inherit;
  box-shadow: inset 0 0 46px rgba(15, 23, 42, 0.55);
}
.event-art-wrap::after {  /* CRT 扫描线 */
  content: ''; position: absolute; inset: 0; z-index: 1; pointer-events: none;
  border-radius: inherit;
  background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.10) 0 1px, transparent 1px 3px);
  opacity: 0.25;
}
.event-art {
  position: absolute; inset: 0;
  width: 100%; height: 100%; object-fit: cover;
  display: block;
}
.event-art-wrap .scene-badge {  /* 浮动角标徽章 */
  position: absolute; z-index: 2;
  margin: 0; bottom: 10px; right: 10px;
  width: 50px; height: 50px;
}
.event-art-wrap .scene-badge .ico { width: 26px; height: 26px; }

.ending-icon { font-size: 60px; margin-bottom: 10px; }
.ending-name {
  font-size: 32px; font-weight: 800; letter-spacing: 2px; margin-bottom: 18px;
  background: linear-gradient(135deg, #fbbf24, #f59e0b);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
}
.ending-name.bad { background: linear-gradient(135deg, #f87171, #dc2626); -webkit-background-clip: text; background-clip: text; }
.ending-desc { font-size: 14.5px; line-height: 2; color: #cbd5e1; margin-bottom: 18px; }
.ending-stats {
  display: flex; justify-content: center; gap: 12px; flex-wrap: wrap;
  font-size: 12px; color: var(--text-dim);
  font-family: "SF Mono", "Consolas", monospace;
  margin-bottom: 8px;
}
.ending-progress { font-size: 12px; color: var(--accent); margin-bottom: 14px; }

/* ============ 图鉴 ============ */
.gallery-overlay {
  position: fixed; inset: 0; z-index: 95;
  background: rgba(2, 6, 23, 0.92);
  display: flex; align-items: center; justify-content: center;
  padding: 20px; animation: fadeIn 300ms ease;
}
.gallery-panel {
  width: 100%; max-width: 440px; max-height: 84vh;
  background: var(--card-bg); border: 1px solid var(--border);
  border-radius: 18px; padding: 20px;
  display: flex; flex-direction: column;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
.gallery-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.gallery-head h2 { font-size: 17px; }
.gallery-close { background: none; border: none; color: var(--text-dim); font-size: 22px; cursor: pointer; }
.gallery-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
  overflow-y: auto;
}
.gallery-cell {
  border: 1px solid var(--border); border-radius: 10px;
  padding: 10px 6px; text-align: center; font-size: 12px;
  min-height: 62px; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 3px;
}
.gallery-cell .g-icon { font-size: 20px; height: 24px; display: flex; align-items: center; justify-content: center; }
.gallery-cell .g-icon .ico { width: 22px; height: 22px; color: var(--accent); }
.gallery-cell.unlocked { border-color: rgba(245, 158, 11, 0.5); background: rgba(245, 158, 11, 0.06); }
.gallery-cell.locked { color: rgba(148, 163, 184, 0.4); }
.gallery-count { font-size: 12px; color: var(--text-dim); margin-top: 10px; text-align: center; }

/* ============ 昏睡/过渡提示 ============ */
.interstitial {
  position: fixed; inset: 0; z-index: 70;
  background: rgba(2, 6, 23, 0.9);
  display: flex; align-items: center; justify-content: center;
  text-align: center; padding: 24px;
  animation: fadeIn 400ms ease;
}
.interstitial p { font-size: 16px; line-height: 2; color: #cbd5e1; max-width: 340px; }

/* ============ 底部工具行 ============ */
.tool-row { display: flex; gap: 8px; margin-top: 12px; }
.tool-row .btn { margin-top: 0; padding: 8px 10px; font-size: 12px; font-weight: 400; color: var(--text-dim); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}
@media (min-width: 481px) {
  #app { border-left: 1px solid rgba(148, 163, 184, 0.08); border-right: 1px solid rgba(148, 163, 184, 0.08); }
}
/* ============ 视口适配：100dvh 修正 iOS Safari 地址栏（vh 兜底） ============ */
html, body { min-height: 100vh; min-height: 100dvh; }

/* ============ 游戏主界面容器：固定一屏 + 滚动兜底 ============ */
.game-wrap {

}

.screen-title {

}

/* ============ 紧凑布局：默认（#app max-width 480px，所有用户都是移动端宽度） ============ */

/* 事件卡片紧凑化 */
.event-area { padding: 5px 0; justify-content: flex-start; }
.event-card { padding: 11px 13px; border-radius: 13px; }

/* 手牌 & 工具栏紧凑化 */
.hand-area { margin-top: 3px; }

/* =====================================================
 * 音效（Web Audio API，零素材）
 * ===================================================== */
const Sound = {
  ctx: null,
  ensure() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) this.ctx = new AC();
    }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },
  beep(freq = 660, dur = 0.08, type = 'sine', gain = 0.06, when = 0) {
    this.ensure();
    if (!this.ctx) return;
    const t = this.ctx.currentTime + when;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = type; osc.frequency.value = freq;
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); g.connect(this.ctx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  },
  click()  { this.beep(660, 0.07); },
  card()   { this.beep(523, 0.1, 'sine', 0.06, 0); this.beep(784, 0.12, 'sine', 0.06, 0.09); },
  warn()   { this.beep(220, 0.15, 'square', 0.04); },
  ending(good) {
    if (good) { [523, 659, 784, 1047].forEach((f, i) => this.beep(f, 0.18, 'sine', 0.06, i * 0.12)); }
    else { [392, 330, 262, 196].forEach((f, i) => this.beep(f, 0.22, 'sine', 0.06, i * 0.16)); }
  }
};

/* =====================================================
 * 状态层
 * ===================================================== */
class GameState {
  constructor() {
    this.unlockedEndings = new Set(
      JSON.parse(localStorage.getItem('lawSchool_endings') || '[]')
    );
    this.reset();
  }
  reset() {
    this.day = 1;
    this.maxDay = 7;
    this.resources = { gpa: 50, eng: 50, san: 50, soc: 50, bar: 0 };
    this.flags = {};            // flag -> 计数（结局需要 ≥2 的计数 flag）
    this.hand = [];             // 知识卡 ID，上限 5
    this.history = [];          // { day, event, choice, resources }
    this.usedEvents = new Set();// 本局已抽过的随机事件（不重复）
    this.geniusDays = 0;        // 学霸附体剩余天数
    this.isolationDays = 0;     // 社交隔离剩余天数
    this.speedPenalty = 0;     // 三天速成法：次日 SAN -20（计数器，支持多张叠加）
    this.wangBoost = false;     // 王泽鉴：GPA 上限 110（本局永久）
    this.sleepCrash = false;    // 精力归零：明日昏睡
    this.lastDeltas = {};
  }
  cap(key) {
    if (key === 'gpa' && this.wangBoost) return 110;
    if (key === 'san') { const coffeeCnt = this.countCard('card_coffee'); if (coffeeCnt > 0) return Math.max(50, 100 - 5 * coffeeCnt); }
    return 100;
  }
  addResource(key, delta) {
    const old = this.resources[key];
    this.resources[key] = Math.max(0, Math.min(this.cap(key), old + delta));
    return this.resources[key] - old;
  }
  addFlag(f) { this.flags[f] = (this.flags[f] || 0) + 1; }
  flagCount(f) { return this.flags[f] || 0; }
hasCard(id) { return this.hand.includes(id); }
  countCard(id) { return this.hand.filter(x => x === id).length; }
  saveEndings() {
    localStorage.setItem('lawSchool_endings', JSON.stringify([...this.unlockedEndings]));
  }
  saveRun(currentEventId) {
    const data = {
      day: this.day, resources: this.resources, flags: this.flags,
      hand: this.hand, history: this.history,
      usedEvents: [...this.usedEvents],
      geniusDays: this.geniusDays, isolationDays: this.isolationDays,
      speedPenalty: this.speedPenalty, wangBoost: this.wangBoost,
      sleepCrash: this.sleepCrash, currentEventId,
      lastDeltas: this.lastDeltas, lastExtraCard: this.lastExtraCard
    };
    localStorage.setItem('lawSchool_inProgress', JSON.stringify(data));
  }
  loadRun() {
    const raw = localStorage.getItem('lawSchool_inProgress');
    if (!raw) return null;
    try {
      const d = JSON.parse(raw);
      this.reset();
      this.day = d.day; this.resources = d.resources; this.flags = d.flags || {};
      this.hand = d.hand || []; this.history = d.history || [];
      this.usedEvents = new Set(d.usedEvents || []);
      this.geniusDays = d.geniusDays || 0; this.isolationDays = d.isolationDays || 0;
      this.speedPenalty = d.speedPenalty || 0; this.wangBoost = !!d.wangBoost;
      this.sleepCrash = !!d.sleepCrash;
      this.lastDeltas = d.lastDeltas || {};
      this.lastExtraCard = d.lastExtraCard || null;
      return d.currentEventId;
    } catch (e) { return null; }
  }
  clearRun() { localStorage.removeItem('lawSchool_inProgress'); }
}

/* =====================================================
 * 逻辑层
 * ===================================================== */
class GameEngine {
  constructor(state) {
    this.state = state;
    this.currentEvent = null;
  }

  checkCondition(cond) {
    const s = this.state;
    if (cond.day && s.day !== cond.day) return false;
    if (cond.flag && !s.flags[cond.flag]) return false;
    if (cond.gpaAbove && s.resources.gpa <= cond.gpaAbove) return false;
    if (cond.engBelow && s.resources.eng >= cond.engBelow) return false;
    return true;
  }

  getAvailableEvents() {
    const s = this.state;
    return EVENTS.filter(e => {
      if (e.fixed || e.chain) return false;
      if (s.usedEvents.has(e.id)) return false;
      if (e.cond) return this.checkCondition(e.cond);
      if (e.day !== null) return e.day === s.day;
      return true;
    });
  }

  drawEvent() {
    const s = this.state;
    // Day 7 强制"考试前一天"（若未触发过）
    if (s.day === 7 && !s.usedEvents.has('EVT_030')) {
      s.usedEvents.add('EVT_030');
      return EVENTS.find(e => e.id === 'EVT_030');
    }
    let pool = this.getAvailableEvents();
    if (pool.length === 0) { // 池抽空则重置（保留固定/链式事件标记，避免重复触发）
      s.usedEvents = new Set([...s.usedEvents].filter(id => {
        const ev = EVENTS.find(e => e.id === id);
        return ev && (ev.fixed || ev.chain);
      }));
      pool = this.getAvailableEvents();
    }
    const total = pool.reduce((sum, e) => sum + e.weight, 0);
    let r = Math.random() * total;
    for (const e of pool) { r -= e.weight; if (r <= 0) { s.usedEvents.add(e.id); return e; } }
    const last = pool[pool.length - 1];
    s.usedEvents.add(last.id);
    return last;
  }

  /* 统一的效果应用管道：知识卡修正 → 阈值钳制，返回实际变动 */
  applyEffects(effects, event, opts = {}) {
    const s = this.state;
    const deltas = {};
    const notes = [];
    for (const key of Object.keys(RES_META)) {
      let delta = effects[key] || 0;
      if (delta === 0) continue;

      // 学霸附体：正面效果 +50%
      if (delta > 0 && s.geniusDays > 0) delta = Math.ceil(delta * 1.5);
      // 网课倍速：BAR+50%/张 / ENG消耗+20%/张（叠加：3张=+150%增速、+60%消耗）
      const x2cnt = s.countCard('card_2x');
      if (x2cnt > 0) {
        if (key === 'bar' && delta > 0) delta = Math.ceil(delta * (1 + 0.5 * x2cnt));
        if (key === 'eng' && delta < 0) delta = Math.round(delta * (1 + 0.2 * x2cnt));
      }
      // 社交隔离：正面社交归零
      if (key === 'soc' && delta > 0 && s.isolationDays > 0) {
        delta = 0; notes.push('社交隔离中，社交收益无效');
      }
      // 老师的好感：课堂类事件负面减半（乘法叠加：1张=×0.5、2张=×0.25、3张=×0.125）
      const profCnt = s.countCard('card_prof');
      if (delta < 0 && profCnt > 0 && event && event.tags.includes('class')) {
        delta = Math.round(delta * Math.pow(0.5, profCnt));
      }
      // 往年真题：抵消一次 GPA/BAR 负面
      if (delta < 0 && (key === 'gpa' || key === 'bar') && s.hasCard('card_past')) {
        s.hand.splice(s.hand.indexOf('card_past'), 1);
        delta = 0; notes.push('📝 往年真题抵消了一次负面效果！');
      }
      const actual = s.addResource(key, delta);
      if (actual !== 0) deltas[key] = (deltas[key] || 0) + actual;
    }
    // 学科联动卡（每次事件一次，roll 分支跳过避免重复触发）
    if (event && !opts.skipLinkCards) {
      const civilCnt = s.countCard('card_civil');
      if (civilCnt > 0 && event.tags.includes('civil')) {
        const bonus = 5 * civilCnt;
        deltas.gpa = (deltas.gpa || 0) + s.addResource('gpa', bonus);
        notes.push(`⚖️ 请求权基础发动：GPA +${bonus}`);
      }
      const crimCnt = s.countCard('card_crim');
      if (crimCnt > 0 && event.tags.includes('crim')) {
        const bonus = 5 * crimCnt;
        deltas.bar = (deltas.bar || 0) + s.addResource('bar', bonus);
        notes.push(`🔨 构成要件该当性发动：法考 +${bonus}`);
      }
      // 柏浪涛：BAR 增加则额外 +3/张（在所有 BAR 加成之后触发）
      const bolangCnt = s.countCard('card_bolang');
      if (bolangCnt > 0 && (deltas.bar || 0) > 0) {
        const bonus = 3 * bolangCnt;
        deltas.bar += s.addResource('bar', bonus);
      }
    }
    s.lastDeltas = deltas;
    return { deltas, notes };
  }

  drawRandomCard() {
    const weights = { '普通': 10, '稀有': 4, '史诗': 1 };
    const total = CARDS.reduce((sum, c) => sum + weights[c.rarity], 0);
    let r = Math.random() * total;
    for (const c of CARDS) { r -= weights[c.rarity]; if (r <= 0) return c.id; }
    return CARDS[0].id;
  }

  /* 获得知识卡（含入手效果），返回卡对象供弹窗展示 */
  gainCard(cardId, depth = 0) {
    const s = this.state;
    if (s.hand.length >= 10) s.hand.shift();
    s.hand.push(cardId);
    // 记录入手前资源，用于更新 lastDeltas
    const before = { ...s.resources };
    this.applyCardEffect(cardId, depth);
    // Bug 4: 确保资源不超过新的上限（如 card_coffee 降低 san 上限）
    for (const k of Object.keys(RES_META)) {
      if (s.resources[k] > s.cap(k)) s.resources[k] = s.cap(k);
    }
    // Bug 7: 入手效果更新 lastDeltas（只在最外层更新，避免递归重复累加）
    if (!depth) {
      for (const k of Object.keys(RES_META)) {
        const d = s.resources[k] - before[k];
        if (d !== 0) s.lastDeltas[k] = (s.lastDeltas[k] || 0) + d;
      }
    }
    return CARDS.find(c => c.id === cardId);
  }

  /* 知识卡入手效果（拆分出来，便于 card_roommate 递归调用） */
  applyCardEffect(cardId, depth = 0) {
    const s = this.state;
    switch (cardId) {
      case 'card_speed': s.addResource('eng', 25); s.speedPenalty = (s.speedPenalty || 0) + 1; break;
      case 'card_notes': s.addResource('gpa', 10); break;
      case 'card_mem':   s.addResource('bar', 15); break;
      case 'card_mind':  s.addResource('san', 15); break;
      case 'card_wang':  s.wangBoost = true; s.addResource('gpa', 10); break;
      case 'card_genius': s.geniusDays = 3; break;
      case 'card_luck': {
        // Fisher-Yates 均匀洗牌取前 2 个
        const _keys = Object.keys(RES_META);
        for (let i = _keys.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [_keys[i], _keys[j]] = [_keys[j], _keys[i]];
        }
        const keys = _keys.slice(0, 2);
        keys.forEach(k => s.addResource(k, 10));
        break;
      }
      case 'card_roommate':
        // 递归时避免移除 roommate 自己
        if (depth < 1) {
          const extraId = this.drawRandomCard();
          // 腾出空间：优先移除最旧的非 roommate 卡，全是 roommate 则移除最旧的
          if (s.hand.length >= 10) {
            const idx = s.hand.findIndex(x => x !== 'card_roommate');
            if (idx >= 0) s.hand.splice(idx, 1);
            else s.hand.shift();
          }
          s.hand.push(extraId);
          const beforeExtra = { ...s.resources };
          this.applyCardEffect(extraId, depth + 1);
          // 钳制资源上限
          for (const k of Object.keys(RES_META)) {
            if (s.resources[k] > s.cap(k)) s.resources[k] = s.cap(k);
          }
          // Bug 8: 记录额外抽到的卡，供 choose 显示弹窗
          s.lastExtraCard = extraId;
          // 更新 lastDeltas
          if (!depth) {
            for (const k of Object.keys(RES_META)) {
              const d = s.resources[k] - beforeExtra[k];
              if (d !== 0) s.lastDeltas[k] = (s.lastDeltas[k] || 0) + d;
            }
          }
        }
        break;
    }
  }

  /* 每日开始时结算（咖啡/速成反噬/学业警告/法考狂热/昏睡） */
  dayStartSettlement() {
    const s = this.state;
    const messages = [];
    if (s.sleepCrash) {
      s.sleepCrash = false;
      for (const k of Object.keys(RES_META)) s.addResource(k, -5);
      s.addResource('eng', 25); // 睡醒恢复，避免死循环
      s.day++;
      messages.push('😴 你昏睡了一整天……所有资源 -5，但精力恢复了一些。');
    }
    if (s.day > s.maxDay) return { messages, over: true };
    const coffeeCnt = s.countCard('card_coffee');
    if (coffeeCnt > 0) { const bonus = 5 * coffeeCnt; s.addResource('eng', bonus); messages.push(`☕ 咖啡续命：精力 +${bonus}（${coffeeCnt}张）`); }
    if (s.speedPenalty > 0) { const cnt = s.speedPenalty; s.speedPenalty = 0; s.addResource('san', -20 * cnt); messages.push(`⏩ 速成反噬：San值 -${20 * cnt}`); }
    if (s.resources.gpa <= 20) { s.addResource('san', -5); messages.push('⚠️ 学业警告：焦虑蔓延，San值 -5'); }
    if (s.resources.bar >= 100) { s.addResource('eng', -5); messages.push('📖 法考狂热：过度复习，精力 -5'); }
    if (s.resources.eng <= 0) { s.sleepCrash = true; messages.push('💤 精力枯竭，你感觉自己随时会昏过去……'); }
    if (s.geniusDays > 0) s.geniusDays--;
    if (s.isolationDays > 0) s.isolationDays--;
    return { messages, over: false };
  }

  /* 阈值检查（选择后） */
  checkThresholds() {
    const s = this.state;
    const notes = [];
    if (s.resources.eng <= 0 && !s.sleepCrash) {
      s.sleepCrash = true;
      notes.push('💤 精力枯竭！明天你将昏睡过去。');
    }
    if (s.resources.soc <= 0 && s.isolationDays === 0) {
      s.isolationDays = 3;
      notes.push('🚧 社交隔离：未来 2 天社交收益无效。');
    }
    return notes;
  }

  /* 主选择入口 */
  choose(choiceIndex) {
    const s = this.state;
    const event = this.currentEvent;
    const choice = event.choices[choiceIndex];
    const allNotes = [];

    // 1. 基础效果 + 概率分支
    const base = this.applyEffects(choice.effects || {}, event);
    allNotes.push(...base.notes);
    if (choice.roll) {
      // roll 概率语义：p 为绝对概率（非相对），末分支无 p 表示剩余全部概率
      let r = Math.random(), hit = choice.roll[choice.roll.length - 1];
      for (const branch of choice.roll) {
        if (branch.p === undefined || r < branch.p) { hit = branch; break; }
        r -= branch.p;
      }
      const rb = this.applyEffects(hit.effects || {}, event, { skipLinkCards: true });
      Object.keys(rb.deltas).forEach(k => {
        s.lastDeltas[k] = (s.lastDeltas[k] || 0) + rb.deltas[k];
      });
      allNotes.push(...rb.notes);
      if (hit.note) allNotes.push(hit.note);
    }

    // 2. Flags
    if (choice.flags && choice.flags.add) choice.flags.add.forEach(f => s.addFlag(f));
    if (choice.flags && choice.flags.remove) choice.flags.remove.forEach(f => delete s.flags[f]);

    // 3. 历史
    s.history.push({
      day: s.day, event: event.id, choice: choiceIndex,
      resources: { ...s.resources }
    });

    // 4. 抽卡：指定卡（按 cardChance，默认必得）否则 50% 随机
    let gainedCard = null;
    if (choice.card) {
      const p = choice.cardChance === undefined ? 1 : choice.cardChance;
      if (Math.random() < p) gainedCard = this.gainCard(choice.card);
    } else if (Math.random() < 0.5) {
      gainedCard = this.gainCard(this.drawRandomCard());
    }
    if (gainedCard && gainedCard.id === 'card_roommate' && s.lastExtraCard) {
      const extra = CARDS.find(x => x.id === s.lastExtraCard);
      if (extra) allNotes.push(`🤝 室友的笔记让你额外抽到【${extra.name}】！`);
      s.lastExtraCard = null;
    } else if (s.lastExtraCard) {
      s.lastExtraCard = null;
    }

    // 5. 阈值
    allNotes.push(...this.checkThresholds());

    // 6. SAN 归零 → 立即坏结局（出家/猝死/退学池）
    if (s.resources.san <= 0) {
      const r = s.resources;
      const id = r.eng <= 0 ? 'end_18' : (r.gpa < 20 ? 'end_21' : 'end_19');
      return { type: 'ending', ending: id, deltas: s.lastDeltas, notes: allNotes, card: gainedCard };
    }

    // 7. 连锁事件
    if (choice.next) {
      const p = choice.nextChance === undefined ? 1 : choice.nextChance;
      if (Math.random() < p) {
        this.currentEvent = EVENTS.find(e => e.id === choice.next);
        return { type: 'chain', event: this.currentEvent, deltas: s.lastDeltas, notes: allNotes, card: gainedCard };
      }
    }

    // 8. 进入下一天
    s.day++;
    const settle = this.dayStartSettlement();
    allNotes.push(...settle.messages);
    if (s.resources.san <= 0) {
      const r = s.resources;
      const id = r.eng <= 0 ? 'end_18' : (r.gpa < 20 ? 'end_21' : 'end_19');
      return { type: 'ending', ending: id, deltas: s.lastDeltas, notes: allNotes, card: gainedCard };
    }
    if (settle.over || s.day > s.maxDay) {
      this.currentEvent = EVENTS.find(e => e.id === 'EVT_EXAM');
      return { type: 'exam', event: this.currentEvent, deltas: s.lastDeltas, notes: allNotes, card: gainedCard };
    }
    this.currentEvent = this.drawEvent();
    return { type: 'event', event: this.currentEvent, deltas: s.lastDeltas, notes: allNotes, card: gainedCard };
  }

  /* 结局判定：致命结局优先，再按 GDD 表格顺序 */
  calculateEnding() {
    const s = this.state, r = s.resources;
    const last3 = s.history.slice(-3);
    const exhausted = last3.length >= 3 &&
      last3.every(h => h.resources.eng < 20 && h.resources.san < 20);

    if (r.san <= 0) return 'end_19';
    if (r.eng <= 0 || exhausted) return 'end_18';
    if (r.gpa < 20) return 'end_21';
    if (r.gpa < 35) return 'end_17';

    // === 高端复合结局（多维度条件，优先判定，避免被宽松条件截胡）===
    if (r.gpa >= 85 && r.san >= 30) return 'end_01';
    if (r.gpa >= 80 && r.san >= 50 && r.soc < 45) return 'end_05';
    if (r.gpa >= 75 && r.soc >= 60 && r.san >= 40) return 'end_04';
    if (r.soc >= 60 && r.gpa >= 65 && r.bar >= 40) return 'end_06';
    if (r.bar >= 55 && r.gpa >= 60 && r.eng < 40) return 'end_28';
    if (r.soc >= 55 && r.gpa >= 60 && r.san >= 35 && r.bar >= 25) return 'end_08';
    if (r.soc >= 70 && r.gpa >= 65 && r.bar < 40) return 'end_11';
    if (r.gpa >= 75 && r.soc >= 50) return 'end_07';
    if (r.bar >= 75 && r.san > 10) return 'end_12';
    if (r.bar >= 60 && r.bar < 85 && r.eng < 40) return 'end_13';
    // === 中段结局（条件较宽松，后判定）===
    if (r.gpa >= 75 && r.soc >= 20) return 'end_02';
    if (r.soc >= 70 && r.gpa < 70 && r.san >= 40) return 'end_10';
    if (r.gpa >= 50 && r.gpa < 70 && r.bar >= 30 && r.bar < 60 && r.soc >= 30) return 'end_24';
    if (r.gpa >= 40 && r.gpa < 75 && r.bar >= 50 && r.soc >= 30) return 'end_25';
    if (r.gpa >= 60 && r.soc >= 40 && r.san >= 30) return 'end_09';
    if (r.gpa >= 60 && r.gpa < 80 && r.bar < 50 && r.san >= 20) return 'end_03';
    if (r.gpa >= 65 && r.gpa < 85 && r.bar < 60) return 'end_23';
    if (r.bar >= 50 && r.bar < 80) return 'end_14';
    if (r.bar < 30 && (r.gpa > 70 || r.soc > 70)) return 'end_15';
    if (r.soc >= 85 && r.gpa < 60 && s.flagCount('flag_live') >= 2) return 'end_16';
    if (r.soc < 20 && r.gpa < 50 && s.flagCount('flag_family') >= 1) return 'end_22';

    const vals = [r.gpa, r.eng, r.san, r.soc, r.bar];
    // 普通人窗口缩窄：48~62，且必须没有极端 flag
    const isAverage = vals.every(v => v >= 48 && v <= 62);
    const hasExtremeFlag = s.flagCount('flag_stay_up') >= 2
                        || s.flagCount('flag_gamer') >= 2
                        || s.flagCount('flag_ditch_club') >= 1;
    if (isAverage && !hasExtremeFlag) return 'end_20';

    // 偏科判定：最高项与次高项差距 ≥ 15 才算偏科
    const sorted = Object.entries(r).sort((a, b) => b[1] - a[1]);
    const [topKey, topVal] = sorted[0];
    const secondVal = sorted[1][1];
    if (topVal - secondVal < 15) return 'end_20';  // 差距不足仍判普通人

    // 真偏科：按最高项 + 资源条件组合归类（符合结局语义）
    if (topKey === 'gpa' && r.bar < 50 && r.gpa < 80) return 'end_03';   // 偏绩点+法考低 → 考研二战
    if (topKey === 'bar' && r.gpa < 60 && r.bar < 80) return 'end_14';   // 偏法考+绩点低 → 法考二战
    if (topKey === 'soc' && r.gpa < 70) return 'end_10';   // 偏社交+绩点一般 → 转行互联网
    if (topKey === 'san' && r.bar < 30) return 'end_15';   // 偏心态+法考低 → 放弃法考
    if (topKey === 'eng' && r.gpa >= 60) return 'end_09';  // 偏精力+能毕业 → 企业法务（养老）
    return 'end_20'; // 最终兜底
  }
}

/* =====================================================
 * 渲染层
 * ===================================================== */
class Renderer {
  constructor(appId) {
    this.app = document.getElementById(appId);
    this.toast = document.getElementById('deltaToast');
  }
  el(html) {
    const t = document.createElement('template');
    t.innerHTML = html.trim();
    return t.content.firstChild;
  }

  /* 自定义确认对话框（替代原生 confirm，返回 Promise<boolean>）
     避免 IDE 内置 webview 在处理同步 confirm() 时触发 React 渲染循环 */
  confirm(message) {
    return new Promise(resolve => {
      const ov = this.el(`
        <div class="confirm-overlay" role="dialog" aria-modal="true" aria-label="确认操作">
          <div class="confirm-panel">
            <p class="confirm-msg">${message}</p>
            <div class="confirm-actions">
              <button class="confirm-cancel" type="button">取消</button>
              <button class="confirm-ok" type="button">确认</button>
            </div>
          </div>
        </div>`);
      document.body.appendChild(ov);
      const close = (result) => { ov.remove(); resolve(result); };
      ov.querySelector('.confirm-cancel').onclick = () => { Sound.click(); close(false); };
      ov.querySelector('.confirm-ok').onclick = () => { Sound.click(); close(true); };
      ov.addEventListener('click', (e) => { if (e.target === ov) close(false); });
      ov.querySelector('.confirm-cancel').focus();
    });
  }

  /* ---------- 标题页 ---------- */
  renderTitle() {

    this.app.innerHTML = '';

        </a>

        <div class="float-deco" style="top:20%;right:10%;width:28px;height:28px;animation-delay:1.4s">${ico('gavel')}</div>

  /* ---------- 资源条 ---------- */
  renderResources(state, prevResources) {
    const rows = Object.keys(RES_META).map(k => {
      const m = RES_META[k];
      const val = state.resources[k];
      const cap = state.cap(k);
      const pct = Math.round((val / cap) * 100);
      const changed = prevResources && prevResources[k] !== undefined && Math.abs(val - prevResources[k]) >= 15;
      return `
        <div class="res-row${changed ? ' warn' : ''}" data-res="${k}">
          <span class="res-icon">${m.icon}</span>
          <span class="res-name">${m.name}</span>
          <div class="res-track"><div class="res-fill ${m.cls}" style="width:${pct}%"></div></div>
          <span class="res-num mono">${val}</span>
        </div>`;
    }).join('');
    return `<div class="resources">${rows}</div>`;
  }

          </div>

          ${event.chain ? '<span class="event-tag">突发</span>' : ''}
          <div class="event-title">${event.title}</div>
          <div class="event-desc">${event.desc}</div>
        </div>
        <div class="choices">
          ${event.choices.map((c, i) => `
            <button class="choice-btn" data-idx="${i}">
              ${event.choices.length > 1 ? `<span class="choice-key">${String.fromCharCode(65 + i)}</span>` : ''}${c.text}
            </button>`).join('')}
        </div>
      </div>
      <div class="hand-area">
        <div class="hand-label">知识卡（${state.hand.length}/10）</div>

      </div>
      <div class="tool-row">
        <button class="btn" id="toolGallery">📖 图鉴</button>

      </div>`;
    this.app.appendChild(wrap);

    wrap.querySelector('#toolGallery').onclick = () => { Sound.click(); this.openGallery(); };
    wrap.querySelector('#toolRestart').onclick = () => {
      Sound.click();
      this.confirm('确定放弃本周进度，重新开始吗？').then(ok => { if (ok) { game.clearRun(); startGame(); } });
    };

    // 退出按钮：返回开始页
    const exitBtn = this.el(`<button class="exit-btn" aria-label="退出到开始页">${ico('home')}<span>退出</span></button>`);
    this.app.appendChild(exitBtn);
    exitBtn.onclick = () => {
      Sound.click();
      this.confirm('确定放弃本周进度，返回开始页吗？').then(ok => { if (ok) { game.clearRun(); this.renderTitle(); } });
    };
    wrap.querySelectorAll('.choice-btn').forEach(btn => {
      btn.onclick = () => onChoice(Number(btn.dataset.idx));
    });

    // 数值跳动动画
    if (prev) {
      wrap.querySelectorAll('.res-num').forEach(n => n.classList.add('bump'));
      setTimeout(() => wrap.querySelectorAll('.res-num').forEach(n => n.classList.remove('bump')), 250);
    }
  }

  renderHand(state) {
    if (state.hand.length === 0) return '<div class="hand-empty">暂无知识卡 · 每次选择后有 50% 概率获得</div>';
    return state.hand.map(id => {
      const c = CARDS.find(x => x.id === id);
      if (!c) return '';
      return `<div class="mini-card ${RARITY_CLS[c.rarity]}" data-card-id="${c.id}" role="button" tabindex="0" aria-label="${c.name}">
        <span class="c-icon">${c.icon}</span><span class="c-name">${c.name}</span>
      </div>`;
    }).join('');
  }

  /* ---------- 浮动数值（逐条展示） ---------- */
  async showDeltas(deltas, notes) {
    const items = [];
    for (const [k, v] of Object.entries(deltas || {})) {
      if (!v) continue;
      const m = RES_META[k];
      items.push(`<div class="delta-item">${m.icon} ${m.name} <span class="${v > 0 ? 'up' : 'down'}">${v > 0 ? '+' : ''}${v}</span></div>`);
    }
    (notes || []).forEach(n => items.push(`<div class="delta-item" style="color:#fbbf24">${n}</div>`));
    if (items.length === 0) return;

    this.toast.classList.remove('fade-out');
    this.toast.innerHTML = items.join('');
    const els = Array.from(this.toast.querySelectorAll('.delta-item'));

    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const step = reduceMotion ? 0 : 380;     // 每条间隔
    const holdMs = reduceMotion ? 500 : 1100; // 全部显示后的阅读停顿
    const fadeMs = 380;                       // 整体淡出时长
    const sleep = ms => new Promise(r => setTimeout(r, ms));

    // 逐条由上到下显示
    for (const el of els) {
      el.classList.add('show');
      if (step > 0) await sleep(step);
    }
    // 阅读停顿
    await sleep(holdMs);
    // 整体淡出后清空
    this.toast.classList.add('fade-out');
    await sleep(fadeMs);
    this.toast.innerHTML = '';
    this.toast.classList.remove('fade-out');
  }

  /* ---------- 过渡提示（昏睡/每日结算） ---------- */
  showInterstitial(messages, cb) {
    const list = (messages || []).filter(m => m);
    if (list.length === 0) { cb(); return; }
    const sleepy = list.some(m => /昏睡|精力枯竭/.test(m));
    const ov = this.el(`<div class="interstitial"><div>
      ${sleepy ? `<div style="display:flex;justify-content:center;margin-bottom:6px"><div class="scene-badge" style="animation:none">${ico('moon')}</div></div><div class="zzz-wrap"><span class="z">Z</span><span class="z">Z</span><span class="z">Z</span></div>` : ''}
      <p>${list.join('<br>')}</p></div></div>`);
    document.body.appendChild(ov);
    setTimeout(() => { ov.remove(); cb(); }, 1800);
  }

  /* ---------- 抽卡弹窗 ---------- */
  showCardPopup(card, cb) {
    Sound.card();
    const ov = this.el(`
      <div class="card-overlay">
        <div class="big-card ${RARITY_CLS[card.rarity]}">
          <div class="bc-rarity">— ${card.rarity} —</div>
          <div class="bc-icon">${card.icon}</div>
          <div class="bc-name">${card.name}</div>
          <div class="bc-desc">${card.desc}</div>

  /* ---------- 结局页 ---------- */
  renderEnding(endingId) {
    const e = ENDINGS.find(x => x.id === endingId);
    game.unlockedEndings.add(endingId);
    game.saveEndings();
    game.clearRun();
    Sound.ending(!e.bad);
    // 清空 #app，移除游戏界面的退出按钮，避免与结局页的退出按钮叠加
    this.app.innerHTML = '';

    const r = game.resources;
    const stats = Object.keys(RES_META).map(k =>
      `<span>${RES_META[k].icon}${r[k]}</span>`).join('');

    const ov = this.el(`
      <div class="ending-screen">
        <div class="ending-inner">
          <div class="ending-label">— FINAL WEEK ENDING —</div>
          <div class="ending-art${e.bad ? ' bad' : ''}">
            <img src="assets/endings/${ENDING_PNG[e.id]}" alt="${e.name}" loading="lazy" onerror="this.style.display='none';var s=this.parentElement.querySelector('svg');if(s)s.style.display='block'">
            <svg viewBox="0 0 320 180" role="img" aria-label="${e.name}" style="display:none"><use href="#art-${e.id.slice(4)}"></use></svg>
          </div>
          <div class="ending-name${e.bad ? ' bad' : ''}">${e.name}</div>
          <div class="ending-desc">${e.desc}</div>
          <div class="ending-stats">${stats}</div>
          <div class="ending-progress">图鉴进度：${game.unlockedEndings.size} / ${ENDINGS.length}</div>
          <button class="btn btn-primary" id="endShare">📤 分享结局</button>
          <button class="btn" id="endAgain">🔁 再来一局</button>
          <button class="btn btn-ghost" id="endGallery">📖 结局图鉴</button>
        </div>
      </div>`);
    document.body.appendChild(ov);

    ov.querySelector('#endShare').onclick = () => {
      Sound.click();
      const text = `我在《法学院：期末周》中达成了【${e.name}】结局（图鉴 ${game.unlockedEndings.size}/${ENDINGS.length}），快来试试你能活过几天！`;
      const done = () => {
        const b = ov.querySelector('#endShare');
        b.textContent = '✅ 已复制到剪贴板';
        setTimeout(() => { b.textContent = '📤 分享结局'; }, 1600);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(() => this.legacyCopy(text, done));
      } else this.legacyCopy(text, done);
    };
    ov.querySelector('#endAgain').onclick = () => { Sound.click(); ov.remove(); startGame(); };
    ov.querySelector('#endGallery').onclick = () => { Sound.click(); this.openGallery(); };

    ov.appendChild(exitBtn);
    exitBtn.onclick = () => { Sound.click(); ov.remove(); this.renderTitle(); };
  }

  legacyCopy(text, done) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    ta.remove(); done();
  }

  /* ---------- 图鉴 ---------- */
  openGallery() {
    const cells = ENDINGS.map(e => {
      const un = game.unlockedEndings.has(e.id);
      return `<div class="gallery-cell ${un ? 'unlocked' : 'locked'}" data-eid="${un ? e.id : ''}"
        title="${un ? e.desc : '继续探索期末周以解锁'}">
        <span class="g-icon">${un ? ico(ENDING_SCENE[e.id] || 'star') : '❓'}</span>
        <span>${un ? e.name : '???'}</span>

    }).join('');
    const ov = this.el(`
      <div class="gallery-overlay">
        <div class="gallery-panel">
          <div class="gallery-head"><h2>📖 结局图鉴</h2><button class="gallery-close">×</button></div>
          <div class="gallery-grid">${cells}</div>
          <div class="gallery-count">已解锁 ${game.unlockedEndings.size} / ${ENDINGS.length} · 点击已解锁结局查看插画</div>
        </div>
      </div>`);
    document.body.appendChild(ov);
    ov.querySelector('.gallery-close').onclick = () => ov.remove();
    ov.addEventListener('click', ev => { if (ev.target === ov) ov.remove(); });
    ov.querySelectorAll('.gallery-cell.unlocked').forEach(cell => {

  /* ---------- 图鉴插画大卡 ---------- */
  showEndingArt(endingId) {
    const e = ENDINGS.find(x => x.id === endingId);
    if (!e) return;
    const ov = this.el(`
      <div class="gallery-overlay" style="z-index:98">
        <div class="gallery-panel" style="text-align:center">
          <div class="gallery-head"><h2>${e.icon} ${e.name}</h2><button class="gallery-close">×</button></div>
          <div class="ending-art${e.bad ? ' bad' : ''}">
            <img src="assets/endings/${ENDING_PNG[e.id]}" alt="${e.name}" loading="lazy" onerror="this.style.display='none';var s=this.parentElement.querySelector('svg');if(s)s.style.display='block'">
            <svg viewBox="0 0 320 180" role="img" aria-label="${e.name}" style="display:none"><use href="#art-${e.id.slice(4)}"></use></svg>
          </div>
          <p style="font-size:13.5px;line-height:1.9;color:#cbd5e1">${e.desc}</p>
        </div>
      </div>`);
    document.body.appendChild(ov);
    ov.querySelector('.gallery-close').onclick = () => ov.remove();
    ov.addEventListener('click', ev => { if (ev.target === ov) ov.remove(); });
  }
}

/* =====================================================
 * 启动 & 流程控制
 * ===================================================== */
const game = new GameState();
const engine = new GameEngine(game);
const renderer = new Renderer('app');

function snapshotRes() { return { ...game.resources }; }

async function onChoice(idx) {
  Sound.click();
  // 防连点
  document.querySelectorAll('.choice-btn').forEach(b => b.disabled = true);

  // 考试日：交卷 → 结局判定
  if (engine.currentEvent.id === 'EVT_EXAM') {
    const endingId = engine.calculateEnding();
    renderer.renderEnding(endingId);
    return;
  }

  const prev = snapshotRes();
  const result = engine.choose(idx);

  // 数值变动 + 提示：逐条展示，等待玩家阅读完成后再继续
  if (Object.values(result.deltas || {}).some(v => Math.abs(v) >= 15)) Sound.warn();
  await renderer.showDeltas(result.deltas, result.notes.filter(n => n));

  const proceed = () => {
    const showNext = () => {
      if (result.type === 'ending') {
        renderer.renderEnding(result.ending);
      } else {
        renderer.renderGame(game, result.event, { prevResources: prev });
        game.saveRun(result.event.id);
      }
    };
    if (result.card) renderer.showCardPopup(result.card, showNext);
    else showNext();
  };

  // 连锁事件直接展示；事件切换时先播过渡信息（昏睡/每日结算）
  // 结算已提供充分阅读时间，此处仅保留呼吸缓冲
  if (result.type === 'chain') {
    setTimeout(proceed, 300);
  } else {
    const dayMsgs = result.notes.filter(n => n && /昏睡|咖啡|速成|学业警告|法考狂热/.test(n));
    setTimeout(() => renderer.showInterstitial(dayMsgs, proceed), 300);
  }
}

function startGame() {
  game.reset();
  engine.currentEvent = EVENTS.find(e => e.id === 'EVT_START');
  game.usedEvents.add('EVT_START');
  renderer.renderGame(game, engine.currentEvent);
  game.saveRun('EVT_START');
}

function continueGame() {
  const evId = game.loadRun();
  const ev = EVENTS.find(e => e.id === evId);
  if (!ev) { startGame(); return; }
  engine.currentEvent = ev;
  renderer.renderGame(game, ev);
}

// 键盘 A/B 快捷键
document.addEventListener('keydown', e => {
  const btns = document.querySelectorAll('.choice-btn:not(:disabled)');
  if (btns.length === 0) return;
  const k = e.key.toLowerCase();
  if (k === 'a' && btns[0]) btns[0].click();
  if (k === 'b' && btns[1]) btns[1].click();
});

renderer.renderTitle();

/* ===== 卡牌说明框交互 ===== */
(function() {
  let tipEl = null, activeCard = null, hideTimer = null;
  function ensureTip() {
    if (tipEl) return tipEl;
    tipEl = document.createElement('div');
    tipEl.className = 'card-tip';
    document.body.appendChild(tipEl);
    return tipEl;
  }
  function showTip(cardEl) {
    const id = cardEl.dataset.cardId;
    if (!id) return;
    const c = CARDS.find(x => x.id === id);
    if (!c) return;
    const tip = ensureTip();
    tip.innerHTML = '<div class="ct-head">'
      + '<span class="ct-icon">' + c.icon + '</span>'
      + '<span class="ct-name">' + c.name + '</span>'
      + '<span class="ct-rarity ' + c.rarity + '">' + c.rarity + '</span>'
      + '</div><div class="ct-desc">' + c.desc + '</div>';
    // 定位：卡牌上方，居中对齐
    const rect = cardEl.getBoundingClientRect();
    const tipW = 200, gap = 8;
    let left = rect.left + rect.width / 2 - tipW / 2;
    left = Math.max(8, Math.min(left, window.innerWidth - tipW - 8));
    let top = rect.top - tip.offsetHeight - gap;
    if (top < 8) top = rect.bottom + gap; // 上方空间不足则显示在下方
    tip.style.left = left + 'px';
    tip.style.top = top + 'px';
    tip.classList.add('show');
    activeCard = cardEl;
  }
  function hideTip() {
    if (tipEl) tipEl.classList.remove('show');
    activeCard = null;
  }
  // 事件委托：hover（桌面）+ click/tap（移动）
  document.addEventListener('pointerover', function(e) {
    const card = e.target.closest('.mini-card');
    if (card && card.dataset.cardId) {
      clearTimeout(hideTimer);
      showTip(card);
    } else if (!e.target.closest('.card-tip')) {
      hideTimer = setTimeout(hideTip, 100);
    }
  });
  document.addEventListener('pointerout', function(e) {
    const card = e.target.closest('.mini-card');
    if (card) {
      hideTimer = setTimeout(hideTip, 100);
    }
  });
  // 移动端点击切换
  document.addEventListener('click', function(e) {
    const card = e.target.closest('.mini-card');
    if (card && card.dataset.cardId) {
      if (activeCard === card) { hideTip(); }
      else { clearTimeout(hideTimer); showTip(card); }
    } else if (!e.target.closest('.card-tip')) {
      hideTip();
    }
  });
  // 键盘可访问性
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') hideTip();
  });
  // 滚动时隐藏
  window.addEventListener('scroll', hideTip, { passive: true });
})();
</script>
